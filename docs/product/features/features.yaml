    value: >-
      Transparent charging: the price shown is the price paid.
    value_vi: >-
      Sạc minh bạch: giá hiển thị đúng bằng giá phải trả.
    users: [DRIVER, ACCOUNTANT]
    capabilities:
      - ["Receipt in the app right after charging", "Biên nhận trên app ngay sau khi sạc"]
      - ["Unit price from the tariff applied to the session", "Đơn giá theo biểu giá áp dụng cho phiên"]
