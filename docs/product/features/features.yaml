  - code: CHG-01
    name: Start charging by QR code
    name_vi: Bắt đầu sạc bằng mã QR
    what: >-
      The driver scans the QR code on the charger, the system starts the
      charge remotely, and the app shows its progress until it stops.
    what_vi: >-
      Tài xế quét mã QR trên trụ, hệ thống bắt đầu sạc từ xa, và app hiển thị
      tiến trình sạc tới khi dừng.
    value: >-
      Scan, charge, pay in three steps for companies and individual drivers
      alike.
    value_vi: >-
      Quét, sạc, thanh toán trong ba bước cho cả doanh nghiệp và tài xế cá
      nhân.
    users: [DRIVER]
    capabilities:
      - ["Scan the gun's QR code and confirm", "Quét mã QR của súng sạc và xác nhận"]
      - ["Record who started the charge and which organization pays", "Ghi nhận ai bắt đầu sạc và tổ chức nào trả tiền"]
      - ["Live progress: kWh, battery %, power, cost so far", "Tiến trình realtime: kWh, % pin, công suất, chi phí tạm tính"]
      - ["Stop from the app or at the charger", "Dừng từ app hoặc tại trụ"]
      - ["Keep the session and bill later if the signal is weak", "Giữ phiên và tính tiền sau nếu sóng yếu"]
    surfaces: {backend: todo, app: todo}
