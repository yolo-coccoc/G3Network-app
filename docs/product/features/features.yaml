  - code: SAF-09
    name: Camera data retention compliance
    name_vi: Tuân thủ lưu trữ dữ liệu camera
    what: >-
      Check the mandatory retention periods: journey data ≥30 days on the
      device, ≥1 year on the service server, ≥3 years at the traffic police;
      driver images ≥3 days on the device; violation data ≥3 months.
    what_vi: >-
      Đối chiếu thời hạn lưu bắt buộc: hành trình ≥30 ngày trên thiết bị, ≥1
      năm trên máy chủ dịch vụ, ≥3 năm tại Cục CSGT; hình ảnh người lái ≥3 ngày
      trên thiết bị; dữ liệu vi phạm ≥3 tháng.
    value: >-
      Avoids penalties at inspections.
    value_vi: >-
      Tránh bị xử phạt khi thanh tra.
    users: [OPERATIONS]
    capabilities:
      - ["Retention status per data type and storage location", "Tình trạng lưu trữ theo loại dữ liệu và nơi lưu"]
      - ["Alert before data would be missing", "Cảnh báo trước khi dữ liệu có nguy cơ thiếu"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [SAF-03, PLT-04]
    sources: [Data OUT-66]
    questions:
      - ["Do we already have a storage partner (Vietmap)?", "Đã có đối tác lưu trữ (Vietmap) chưa?"]

