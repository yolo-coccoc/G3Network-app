  - code: CHG-02
    name: Charging session record
    name_vi: Bản ghi phiên sạc
    what: >-
      Keep an unchangeable record of every session: time, station, gun,
      power, kWh, start and end battery %, duration and cost, plus all meter
      readings.
    what_vi: >-
      Lưu bản ghi không sửa đổi của mọi phiên sạc: thời gian, trạm, súng, công
      suất, kWh, % pin đầu–cuối, thời lượng và chi phí, cùng mọi chỉ số đo.
    value: >-
      The single source for billing, warranty and disputes; 100% of sessions
      on our network are logged.
    value_vi: >-
      Nguồn duy nhất cho tính tiền, bảo hành và tranh chấp; 100% phiên sạc
