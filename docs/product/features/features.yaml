  - code: PLT-03
    name: System health dashboard
    name_vi: Dashboard sức khỏe hệ thống
    what: >-
      Uptime, ingestion delay, data-flow interruptions and data quality, with
      alerts to the operations team.
    what_vi: >-
      Uptime, độ trễ thu nhận, gián đoạn luồng dữ liệu và chất lượng dữ liệu,
      có cảnh báo tới đội vận hành.
    value: >-
      Problems are seen before customers report them.
    value_vi: >-
      Thấy sự cố trước khi khách hàng báo.
    users: [OPERATIONS]
    capabilities:
      - ["Health of every process (API, ingestion, charger gateway, monitors)", "Sức khỏe từng tiến trình (API, thu nhận dữ liệu, cổng trụ sạc, giám sát)"]
      - ["Alert on ingestion stop", "Cảnh báo khi luồng dữ liệu bị dừng"]
      - ["Centralized logs and metrics", "Log và chỉ số tập trung"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [Data OUT-61, NF-14, deferred.md 17, deferred.md 19]

  - code: PLT-04
    name: Data retention and archiving
    name_vi: Lưu trữ & lưu trữ lạnh dữ liệu
    what: >-
      Keep time-series data hot for 12 months and cold for 5 years (the
      warranty period), with per-type retention rules.
    what_vi: >-
      Lưu dữ liệu chuỗi thời gian dạng nóng 12 tháng và lạnh 5 năm (bằng thời
      hạn bảo hành), có quy tắc lưu theo từng loại dữ liệu.
    value: >-
      Meets legal and warranty needs while controlling storage cost.
    value_vi: >-
      Đáp ứng yêu cầu pháp lý và bảo hành mà vẫn kiểm soát chi phí lưu trữ.
    users: [SYSTEM, OPERATIONS]
    capabilities:
      - ["Retention rules per data type", "Quy tắc lưu theo loại dữ liệu"]
      - ["Automatic move to cold storage and deletion", "Tự động chuyển sang lưu trữ lạnh và xóa"]
    surfaces: {backend: todo}
    priority: Should
    release: P1.0
    offer: internal
    sources: [NF-16, deferred.md 48]

  - code: PLT-05
    name: Data sovereignty monitoring
    name_vi: Giám sát chủ quyền dữ liệu
    what: >-
      Map which data leaves the truck, to which servers, in which country and
      to which third parties; detect undeclared foreign connections and
      compare them with the manufacturer's written commitments.
    what_vi: >-
      Lập bản đồ dữ liệu nào rời khỏi xe, tới máy chủ nào, đặt ở quốc gia nào,
      bên thứ ba nào nhận; phát hiện kết nối tới máy chủ nước ngoài không khai
      báo và đối chiếu với cam kết bằng văn bản của nhà sản xuất.
    value: >-
      Protects national and customer data; verified, not taken on trust.
    value_vi: >-
      Bảo vệ dữ liệu quốc gia và khách hàng; được kiểm chứng, không dựa vào
      cam kết miệng.
    users: [OPERATIONS, HEAD_ADMIN]
    capabilities:
      - ["Declared data-flow map per device type", "Bản đồ luồng dữ liệu khai báo theo loại thiết bị"]
      - ["Traffic monitoring during the pilot", "Giám sát lưu lượng trong giai đoạn pilot"]
      - ["Report of undeclared foreign connections", "Báo cáo kết nối nước ngoài không khai báo"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [Data IN-24, Data OUT-60, Prerequisite 2]

  - code: PLT-06
    name: Executive KPI dashboard
    name_vi: Bộ KPI cho Ban lãnh đạo
    what: >-
      North Star (weekly active vehicles), charging compliance, app
      activation, CSAT/NPS, revenue and number of trucks.
    what_vi: >-
      Chỉ số North Star (WHAV), tuân thủ sạc, kích hoạt app, CSAT/NPS, doanh
      thu và số xe.
    value: >-
      Leadership steers the business on a few clear numbers.
    value_vi: >-
      Ban lãnh đạo điều hành bằng vài con số rõ ràng.
    users: [HEAD_ADMIN]
    capabilities:
      - ["KPI set with targets and trend", "Bộ KPI kèm mục tiêu và xu hướng"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.0
    offer: internal
    depends_on: [PAY-13, POL-04, VEH-05]
    sources: [Data OUT-37]
    questions:
