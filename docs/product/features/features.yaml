  - code: SAF-08
    name: Data transmission to authorities
    name_vi: Truyền dữ liệu về cơ quan quản lý
    what: >-
      Send real-time journey data and driver violation data to the
      authorities and keep the transmission receipts.
    what_vi: >-
      Truyền dữ liệu hành trình theo thời gian thực và dữ liệu vi phạm của lái
      xe về cơ quan quản lý, lưu biên nhận truyền.
    value: >-
