      - ["Warning before each limit", "Cảnh báo trước mỗi ngưỡng"]
      - ["Rest-stop suggestion favouring charging stations", "Gợi ý điểm dừng nghỉ ưu tiên trạm sạc"]
    surfaces: {backend: todo, app: todo}
    priority: Must
    release: P1.0
    offer: tbd
    depends_on: [DRV-04, MON-12, STN-06]
    sources: [Data IN-59, Data OUT-19]

