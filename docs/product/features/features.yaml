    target: ["Hot 12 months / cold 5 years; versioned, backward-compatible schemas", "Nóng 12 tháng / lạnh 5 năm; cấu trúc có phiên bản, tương thích ngược"]
    features: [PLT-01, PLT-04]
  - code: NF-17
    category: [Localization, Bản địa hóa]
    requirement: [Language and formats, Ngôn ngữ & định dạng]
    target: ["Vietnamese by default; VND, km, kWh; ready for Lao and Chinese", "Mặc định tiếng Việt; VND, km, kWh; sẵn sàng tiếng Lào và tiếng Trung"]
    features: []
  - code: NF-18
    category: [Maintainability, Khả năng bảo trì]
    requirement: ["Modular code, tests, API docs", "Mã nguồn module hóa, kiểm thử, tài liệu API"]
    target: ["Clear module boundaries; tests for critical flows (battery alert, charging, reconciliation, payment); OpenAPI", "Ranh giới module rõ ràng; kiểm thử luồng quan trọng (cảnh báo pin, sạc, đối soát, thanh toán); OpenAPI"]
    features: []
