    features: [PLT-03]
  - code: NF-15
    category: [Backup & recovery, Sao lưu & khôi phục]
    requirement: [Backup and disaster recovery, Sao lưu & khôi phục thảm họa]
    target: ["RPO ≤15 min, RTO ≤4 h; recovery drill twice a year", "RPO ≤15 phút, RTO ≤4 giờ; diễn tập khôi phục 2 lần/năm"]
    features: []
  - code: NF-16
    category: [Data lifecycle, Vòng đời dữ liệu]
