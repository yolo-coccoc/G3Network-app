      - ["Licence expiry reminder", "Nhắc bằng lái sắp hết hạn"]
      - ["A driver profile belongs to one membership; a former driver keeps their history", "Hồ sơ tài xế thuộc một thành viên tổ chức; tài xế đã nghỉ vẫn giữ lịch sử"]
