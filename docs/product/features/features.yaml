    what: >-
      Keep each driver's facts for one organization: licence number, class and
      expiry, and status.
    what_vi: >-
      Lưu thông tin của tài xế trong một tổ chức: số bằng lái, hạng, ngày hết
      hạn và trạng thái.
    value: >-
      Only drivers with a valid licence are assigned to trucks.
    value_vi: >-
      Chỉ tài xế có bằng lái hợp lệ mới được giao xe.
    users: [FLEET_MANAGER, ORG_ADMIN]
    capabilities:
