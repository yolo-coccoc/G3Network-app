  - code: DRV-04
    name: Driver identification per shift
    name_vi: Định danh tài xế theo ca
    what: >-
      Record who is actually driving each shift, by face, card or app login,
      with shift start and end.
    what_vi: >-
      Ghi nhận ai thực sự lái xe trong từng ca, bằng khuôn mặt, thẻ hoặc đăng
      nhập app, kèm thời điểm bắt đầu và kết thúc ca.
    value: >-
      Legal driving-time records and fair per-driver reports.
    value_vi: >-
      Hồ sơ thời gian lái đúng luật và báo cáo theo tài xế công bằng.
    users: [DRIVER, SYSTEM]
    capabilities:
