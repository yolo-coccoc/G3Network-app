  - code: SAF-07
    name: Camera health and tamper alerts
    name_vi: Giám sát & cảnh báo camera
    what: >-
      Watch each camera for lost signal, covering, misalignment, power loss,
      full storage, clock drift and firmware; tell deliberate covering apart
      from faults and signal loss; report camera uptime and upload success.
    what_vi: >-
      Theo dõi từng camera: mất tín hiệu, bị che, lệch góc, mất nguồn, đầy bộ
