      - ["Public, private and default plans", "Gói công khai, gói riêng và gói mặc định"]
      - ["Basic plan (compliant driver camera + vehicle, battery and charging management) and Advanced plan (in-cab ADAS)", "Gói Cơ bản (camera giám sát người lái hợp quy + quản trị xe, pin, sạc) và gói Nâng cao (ADAS trong cabin)"]
