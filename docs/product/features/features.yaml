  - code: SAF-06
    name: Accident and insurance evidence pack
    name_vi: Hồ sơ trích xuất phục vụ tai nạn & bảo hiểm
    what: >-
      Export clips, route, speed and events around an incident time as one
      evidence pack.
    what_vi: >-
      Trích xuất clip, hành trình, tốc độ và sự kiện quanh thời điểm vụ việc
      thành một hồ sơ bằng chứng.
    value: >-
