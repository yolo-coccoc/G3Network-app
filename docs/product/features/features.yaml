  - code: DRV-05
    name: Driving-time warning
    name_vi: Cảnh báo thời gian lái liên tục
    what: >-
      Remind the driver before reaching 4 hours of continuous driving or 10
      hours a day, and suggest a rest stop, preferably a charging station on
      the route.
    what_vi: >-
      Nhắc tài xế trước khi chạm ngưỡng 4 giờ lái liên tục hoặc 10 giờ/ngày, và
      gợi ý điểm dừng nghỉ, ưu tiên trạm sạc trên tuyến.
    value: >-
      Safer drivers and compliance with driving-time law; rest doubles as a
      charging stop.
    value_vi: >-
      Tài xế an toàn hơn và tuân thủ luật về thời gian lái; thời gian nghỉ kết
      hợp sạc.
    users: [DRIVER, SYSTEM]
    capabilities:
