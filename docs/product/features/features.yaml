  # ---------------------------------------------------------------------------
  # POL — Charging policy & warranty
  # ---------------------------------------------------------------------------

  - code: POL-01
    name: Charging policy configuration
    name_vi: Cấu hình chính sách sạc
    what: >-
      The warranty team sets charging rules: allowed time windows, battery
      min–max (e.g. 20–90%), duration, frequency and power, per truck, fleet
      or model; every version is kept.
    what_vi: >-
      Bộ phận bảo hành đặt quy tắc sạc: khung giờ cho phép, % pin tối thiểu–tối
      đa (vd 20–90%), thời lượng, tần suất và công suất, theo xe, đội xe hoặc
      dòng xe; lưu mọi phiên bản.
    value: >-
      Protects battery life and gives warranty decisions a clear basis.
    value_vi: >-
      Bảo vệ tuổi thọ pin và làm căn cứ rõ ràng cho quyết định bảo hành.
    users: [WARRANTY]
    capabilities:
      - ["Create and version policies; effective immediately", "Tạo và quản lý phiên bản chính sách; hiệu lực ngay"]
      - ["Apply to a truck, a fleet or a model", "Áp dụng cho xe, đội xe hoặc dòng xe"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [PRD F-B1, Data IN-35]
    old_codes: [F-B1]
    questions:
      - ["The actual policy values are a warranty decision still to be made.", "Giá trị cụ thể của chính sách là quyết định bảo hành, chưa được chốt."]

  - code: POL-02
    name: Policy violation detection
    name_vi: Phát hiện vi phạm chính sách sạc
    what: >-
      Check every session against the active policy (charging outside the
      window, battery repeatedly above 90% or below 20%, too much fast
      charging) and flag violations with an unchangeable evidence snapshot.
    what_vi: >-
      Đối chiếu mọi phiên sạc với chính sách đang áp dụng (sạc ngoài khung giờ,
      pin thường xuyên trên 90% hoặc dưới 20%, sạc nhanh quá nhiều) và gắn cờ
      vi phạm kèm ảnh chụp bằng chứng không sửa đổi.
    value: >-
      Evidence that holds in a warranty dispute.
    value_vi: >-
      Bằng chứng có giá trị khi tranh chấp bảo hành.
    users: [SYSTEM]
    capabilities:
      - ["Evaluate each session and the battery pattern over time", "Đánh giá từng phiên và xu hướng pin theo thời gian"]
      - ["Categorized violation with session and telematics evidence", "Vi phạm được phân loại kèm bằng chứng phiên sạc và telematics"]
    surfaces: {backend: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [POL-01, CHG-07, MON-01]
    touches: [charging_sessions, telemetry]
    sources: [PRD F-B3, NF-11]
    old_codes: [F-B3]
    questions:
      - ["Is a violation only a warning, or does it carry a contractual penalty?", "Vi phạm chỉ là cảnh báo hay kèm chế tài theo hợp đồng?"]

  - code: POL-03
    name: Warranty-risk alert
    name_vi: Cảnh báo nguy cơ mất bảo hành
    what: >-
      Tell the driver and the truck owner in real time when charging behaviour
      puts the warranty at risk, naming the behaviour and how to fix it, plus
      a periodic summary.
    what_vi: >-
      Báo tài xế và chủ xe ngay khi hành vi sạc gây nguy cơ mất bảo hành, nêu
      rõ hành vi và cách khắc phục, kèm bản tổng hợp định kỳ.
    value: >-
      Customers keep their warranty; fewer disputes.
    value_vi: >-
      Khách hàng giữ được bảo hành; ít tranh chấp hơn.
    users: [DRIVER, FLEET_MANAGER, SYSTEM]
    capabilities:
      - ["Real-time alert per violation", "Cảnh báo tức thời cho mỗi vi phạm"]
      - ["Periodic summary with advice", "Tổng hợp định kỳ kèm khuyến nghị"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: tbd
    depends_on: [POL-02, NTF-01]
    touches: [notifications]
    sources: [PRD F-B5, Data OUT-13]
    old_codes: [F-B5]

  - code: POL-04
    name: Charging compliance score
    name_vi: Điểm tuân thủ sạc
    what: >-
      A compliance score, violation count and warranty risk level per truck,
      shown to the driver and the fleet.
    what_vi: >-
      Điểm tuân thủ, số vi phạm và mức nguy cơ bảo hành theo từng xe, hiển thị
      cho tài xế và đội xe.
    value: >-
      One number that drivers understand and improve.
    value_vi: >-
      Một con số tài xế dễ hiểu và cải thiện được.
    users: [DRIVER, FLEET_MANAGER, WARRANTY]
    capabilities:
      - ["Score, violations and risk level per truck", "Điểm, số vi phạm và mức nguy cơ theo xe"]
      - ["Trend over time", "Xu hướng theo thời gian"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: tbd
    depends_on: [POL-02]
    sources: [Data OUT-14, Data OUT-30]
    questions:
      - ["The scoring method waits for the policy (no policy yet).", "Cách tính điểm chờ có chính sách (hiện chưa có)."]

  - code: POL-05
    name: Warranty status dashboard
    name_vi: Bảng trạng thái bảo hành
    what: >-
      For the warranty team and fleet managers: compliance, violations and
      risk per truck, filterable by risk, with an export for the warranty
      team.
    what_vi: >-
      Cho bộ phận bảo hành và quản lý đội xe: tuân thủ, vi phạm và mức nguy cơ
      theo xe, lọc theo mức nguy cơ, xuất báo cáo cho bộ phận bảo hành.
    value: >-
      The warranty team focuses on the trucks at risk.
    value_vi: >-
      Bộ phận bảo hành tập trung vào những xe có nguy cơ.
    users: [WARRANTY, FLEET_MANAGER]
    capabilities:
      - ["Risk-sorted list of trucks", "Danh sách xe sắp theo mức nguy cơ"]
      - ["Export for the warranty team", "Xuất báo cáo cho bộ phận bảo hành"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: tbd
    depends_on: [POL-04]
    sources: [PRD F-B4, Data OUT-30]
    old_codes: [F-B4]

  - code: POL-06
    name: Violation case files
    name_vi: Hồ sơ vi phạm
    what: >-
      A case file per violation (type, session snapshot, matching telematics
      data), sent to the warranty team on a schedule or on demand, with its
      handling history.
    what_vi: >-
      Hồ sơ cho từng vi phạm (loại, ảnh chụp phiên sạc, dữ liệu telematics đối
      chứng), gửi bộ phận bảo hành định kỳ hoặc khi cần, kèm lịch sử xử lý.
    value: >-
      The warranty team decides on solid evidence.
    value_vi: >-
      Bộ phận bảo hành ra quyết định dựa trên bằng chứng vững chắc.
    users: [WARRANTY, FLEET_MANAGER, SYSTEM]
    capabilities:
      - ["Case file with evidence", "Hồ sơ kèm bằng chứng"]
      - ["Scheduled and on-demand sending", "Gửi định kỳ và theo yêu cầu"]
      - ["Case handling history kept", "Lưu lịch sử xử lý hồ sơ"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.0
    offer: internal
    depends_on: [POL-02]
    sources: [PRD F-B6, Data OUT-31]
    old_codes: [F-B6]

