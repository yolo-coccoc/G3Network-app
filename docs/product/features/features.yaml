      Recurring SaaS revenue collected on time.
    value_vi: >-
      Doanh thu thuê bao định kỳ được thu đúng hạn.
    users: [SALES, ACCOUNTANT, ORG_ADMIN]
    capabilities:
      - ["Agreed price copied onto the subscription", "Giá thỏa thuận được lưu trên thuê bao"]
      - ["Per-truck-per-month billing cycles", "Chu kỳ tính tiền theo xe mỗi tháng"]
      - ["Expiry reminders, feature lock on overdue", "Nhắc hết hạn, khóa tính năng khi quá hạn"]
      - ["Customers see their plan and usage in the portal", "Khách hàng xem gói và mức sử dụng trên portal"]
