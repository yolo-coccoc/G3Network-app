    name: Feature catalog and list prices
    name_vi: Danh mục tính năng & giá niêm yết
    what: >-
      Keep the sellable features with their list price and pricing unit (per
      truck per month, per organization, per user, per message).
    what_vi: >-
      Quản lý các tính năng bán được kèm giá niêm yết và đơn vị tính (theo xe
      mỗi tháng, theo tổ chức, theo người dùng, theo tin nhắn).
    value: >-
      Sales change prices and offers without developers.
    value_vi: >-
      Kinh doanh thay đổi giá và ưu đãi mà không cần lập trình viên.
    users: [SALES, HEAD_ADMIN]
    capabilities:
