      - ["Exact definition of WHAV and how CSAT/NPS are collected.", "Định nghĩa chính xác WHAV và cách thu thập CSAT/NPS."]

  - code: PLT-07
    name: Third-party aggregated data
    name_vi: Dữ liệu tổng hợp từ đối tác ngoài
    what: >-
      Import aggregated, anonymous mobility and demand data by area from
      outside partners.
    what_vi: >-
      Nhập dữ liệu luồng di chuyển và nhu cầu theo khu vực dạng tổng hợp, ẩn
      danh từ đối tác bên ngoài.
    value: >-
      Better station planning and forecasts.
    value_vi: >-
      Quy hoạch trạm và dự báo tốt hơn.
    users: [OPERATIONS]
    capabilities:
      - ["Import and store aggregated datasets", "Nhập và lưu bộ dữ liệu tổng hợp"]
    surfaces: {backend: todo}
    priority: Could
    release: P1.5
    offer: internal
    sources: [Data IN-48]

  # ---------------------------------------------------------------------------
  # TMS — Transport management integration (Phase 2)
  # ---------------------------------------------------------------------------

  - code: TMS-01
    name: Shipments and shippers
    name_vi: Đơn hàng & chủ hàng
    what: >-
      Shippers, shipments and trips, linking trip ↔ truck ↔ driver ↔
      shipment ↔ shipper.
    what_vi: >-
      Chủ hàng, đơn hàng và chuyến hàng, liên kết chuyến ↔ xe ↔ tài xế ↔ đơn
      hàng ↔ chủ hàng.
    value: >-
      Knowing which order a truck is serving for which customer.
    value_vi: >-
      Biết xe đang chạy đơn hàng nào cho khách hàng nào.
    users: [DISPATCHER, FLEET_MANAGER]
    capabilities:
      - ["Shipment data received from the customer's TMS", "Dữ liệu đơn hàng nhận từ TMS của khách hàng"]
      - ["Link shipments to trips through the reserved keys", "Gắn đơn hàng với chuyến qua các khóa dành sẵn"]
    surfaces: {backend: todo, portal: todo}
    priority: Could
    release: P2
    offer: tbd
    depends_on: [MON-11, PLT-01]
    sources: [Phase 2 T1, Prerequisite 6]

  - code: TMS-02
    name: TMS integration and trip milestones
    name_vi: Tích hợp TMS & mốc tác nghiệp chuyến
    what: >-
      Two-way API and webhooks with TMS; geofence events for operational
      milestones (empty container pick-up, factory arrival and departure,
      port arrival).
    what_vi: >-
      API và webhook hai chiều với TMS; sự kiện vùng địa lý cho các mốc tác
      nghiệp (lấy container rỗng, đến/rời nhà máy, đến cảng).
    value: >-
      Shippers get milestones automatically; the G3 app integrates with TMS
      instead of replacing it.
    value_vi: >-
      Chủ hàng nhận các mốc tự động; app G3 tích hợp TMS chứ không thay thế
      TMS.
    users: [EXTERNAL, DISPATCHER]
    capabilities:
      - ["Webhooks for position and milestones", "Webhook cho vị trí và các mốc"]
      - ["Shippers query GPS through the API", "Chủ hàng truy vấn GPS qua API"]
    surfaces: {backend: todo}
    priority: Could
    release: P2
    offer: tbd
    depends_on: [TMS-01, FLT-05, ACC-21]
    sources: [Phase 2 T2, Prerequisite 6]

  - code: TMS-03
    name: Depot directory
    name_vi: Danh mục depot
    what: >-
      Shared service points for dispatching: container depots, shipping-line
      depots and virtual depots with location, services and opening hours.
    what_vi: >-
      Danh mục điểm dịch vụ dùng chung cho điều phối: depot cắt kéo
      container, depot hãng tàu và depot ảo kèm tọa độ, dịch vụ và giờ hoạt
      động.
    value: >-
      Dispatchers plan container moves around known depots.
    value_vi: >-
      Điều vận lập kế hoạch kéo container quanh các depot đã biết.
    users: [DISPATCHER, OPERATIONS]
    capabilities:
      - ["Depot points with services and hours", "Điểm depot kèm dịch vụ và giờ hoạt động"]
    surfaces: {backend: todo, portal: todo}
    priority: Could
    release: P2
    offer: tbd
    sources: [Phase 2 T3]

  - code: TMS-04
    name: Shipper carbon tracing (Scope 3)
    name_vi: Truy vết carbon tới chủ hàng (Scope 3)
    what: >-
      Allocate emissions down the chain shipper → shipment → trip → truck →
      kWh, and report intensity per shipper (gCO₂e/tonne-km) for their Scope
      3.
    what_vi: >-
      Phân bổ phát thải theo chuỗi chủ hàng → đơn hàng → chuyến → xe → kWh, và
      báo cáo cường độ theo chủ hàng (gCO₂e/tấn-km) cho Scope 3 của họ.
    value: >-
      Turns the transport company's Scope 1 & 2 into its customers' Scope 3.
    value_vi: >-
      Chuyển Scope 1 & 2 của doanh nghiệp vận tải thành Scope 3 của khách hàng.
    users: [FLEET_MANAGER, EXTERNAL]
    capabilities:
      - ["Emission allocation per shipment", "Phân bổ phát thải theo đơn hàng"]
      - ["Audit-ready Scope 3 report per shipper", "Báo cáo Scope 3 sẵn sàng kiểm toán theo chủ hàng"]
    surfaces: {backend: todo, portal: todo}
    priority: Could
    release: P2
    offer: tbd
    depends_on: [TMS-01, CRB-08]
    sources: [Phase 2 T4, Phase 2 T6]

  - code: TMS-05
    name: Shipper emission certificates
    name_vi: Chứng thư giảm phát thải cho chủ hàng
    what: >-
      PDF certificates with a lookup code confirming the CO₂ of completed
      shipments, delivered to shippers through the API.
    what_vi: >-
      Chứng thư PDF có mã tra cứu xác nhận lượng CO₂ của các chuyến hàng đã
      thực hiện, gửi chủ hàng qua API.
    value: >-
      A selling point for transport companies to their shippers.
    value_vi: >-
      Lợi thế bán hàng của doanh nghiệp vận tải với chủ hàng.
    users: [FLEET_MANAGER, EXTERNAL]
    capabilities:
      - ["Certificate per period and shipper", "Chứng thư theo kỳ và theo chủ hàng"]
      - ["Public lookup by code", "Tra cứu công khai bằng mã"]
    surfaces: {backend: todo, portal: todo}
    priority: Could
    release: P2
    offer: tbd
    depends_on: [TMS-04]
    sources: [Phase 2 T5, Phase 2 T7]

  - code: TMS-06
    name: Driver operational reports to dispatch
    name_vi: Báo cáo tác nghiệp của tài xế về điều hành
    what: >-
      Drivers send operational reports to their dispatch office so its TMS
      can optimize dispatching.
    what_vi: >-
      Tài xế gửi báo cáo tác nghiệp về đơn vị điều hành để TMS tối ưu điều
      phối.
    value: >-
      Better dispatching from first-hand field information.
    value_vi: >-
      Điều phối tốt hơn nhờ thông tin trực tiếp từ hiện trường.
    users: [DRIVER, DISPATCHER]
    capabilities:
      - ["Report forms in the driver app", "Biểu mẫu báo cáo trên app tài xế"]
      - ["Forward to the TMS", "Chuyển tiếp sang TMS"]
    surfaces: {backend: todo, app: todo}
    priority: Could
    release: P2
    offer: tbd
    depends_on: [TMS-02]
    sources: [Phase 2 T8]

# -----------------------------------------------------------------------------
# Non-functional requirements (platform qualities). Codes kept from the PRD.
# -----------------------------------------------------------------------------

nfrs:
  - code: NF-01
    category: [Performance, Hiệu năng]
    requirement: [Vehicle data latency, Độ trễ dữ liệu xe]
    target: ["≤30 s p95 (target ≤10 s) while online", "≤30 giây p95 (mục tiêu ≤10 giây) khi xe online"]
    features: [MON-01, MON-04, DEV-03]
  - code: NF-02
    category: [Performance, Hiệu năng]
    requirement: [Charger status latency (OCPP), Độ trễ trạng thái trụ sạc (OCPP)]
    target: ["≤30 s; status accuracy ≥99%", "≤30 giây; độ chính xác trạng thái ≥99%"]
    features: [STN-03, STN-04]
  - code: NF-03
    category: [Availability, Tính sẵn sàng]
    requirement: [Platform uptime, Thời gian hoạt động của nền tảng]
    target: ["≥99.5% per month; battery and station alerts are the top-priority flow", "≥99,5%/tháng; cảnh báo pin và trạm là luồng ưu tiên cao nhất"]
    features: [MON-04, PLT-03]
  - code: NF-04
    category: [Scale, Khả năng mở rộng]
    requirement: [Concurrent vehicles and devices, Số xe và thiết bị đồng thời]
    target: ["From 300 (2026) to 1,200+ (2029) without an architecture change", "Từ 300 (2026) lên 1.200+ (2029) không phải đổi kiến trúc"]
    features: [MON-01]
  - code: NF-05
    category: [Security, Bảo mật]
    requirement: [Encryption and key management, Mã hóa & quản lý khóa]
    target: ["TLS 1.2+ in transit, encrypted at rest, secrets in a vault; cards tokenized", "TLS 1.2+ khi truyền, mã hóa khi lưu, bí mật trong kho khóa; thẻ được mã hóa token"]
    features: [PAY-06, STN-11]
  - code: NF-06
    category: [Security, Bảo mật]
    requirement: [Device identity and authentication, Định danh & xác thực thiết bị]
    target: ["Certificate (mTLS) or unique per-device token, revocable", "Chứng chỉ (mTLS) hoặc token riêng từng thiết bị, thu hồi được"]
    features: [DEV-08, DEV-03, VEH-05, DEV-07]
  - code: NF-07
    category: [Security, Bảo mật]
    requirement: [Penetration testing, Kiểm thử xâm nhập]
    target: ["Mandatory before Gate 2; zero critical findings to go live", "Bắt buộc trước Gate 2; không còn lỗ hổng nghiêm trọng khi vận hành"]
    features: []
  - code: NF-08
    category: [Privacy & compliance, Quyền riêng tư & tuân thủ]
    requirement: [Personal-data protection, Bảo vệ dữ liệu cá nhân]
    target: ["Decree 13/2023 and Law 91/2025/QH15: consent at activation, purpose notice, minimal collection, data-subject rights, access audit", "Nghị định 13/2023 và Luật 91/2025/QH15: đồng ý khi kích hoạt, thông báo mục đích, thu thập tối thiểu, quyền chủ thể dữ liệu, nhật ký truy cập"]
    features: [ACC-17, ACC-18, ACC-19, MON-10]
  - code: NF-09
    category: [Reliability, Độ tin cậy]
    requirement: [Buffering on signal loss, Lưu đệm khi mất sóng]
    target: ["≥48 h store-and-forward on the device; no record lost", "Thiết bị lưu đệm ≥48 giờ rồi gửi lại; không mất bản ghi"]
    features: [DEV-03, MON-18, DEV-06]
  - code: NF-10
    category: [Data integrity, Toàn vẹn dữ liệu]
    requirement: [Three-way reconciliation, Đối soát 3 chiều]
    target: ["Charger ↔ vehicle ↔ payment kWh deviation <1%; alert on mismatch", "Lệch kWh giữa trụ ↔ xe ↔ thanh toán <1%; cảnh báo khi lệch"]
    features: [CHG-06, CHG-05, PAY-11]
  - code: NF-11
    category: [Data integrity, Toàn vẹn dữ liệu]
    requirement: [Immutable records, Bản ghi không sửa đổi]
    target: ["Session and violation records are append-only", "Bản ghi phiên sạc và vi phạm chỉ được ghi thêm"]
    features: [CHG-02, POL-02]
  - code: NF-12
    category: [Usability, Trải nghiệm]
    requirement: [Driver app usability, Khả năng sử dụng app tài xế]
    target: ["Vietnamese, outdoor-readable, large text, high contrast, one-handed; core actions ≤3 taps", "Tiếng Việt, đọc được ngoài trời, chữ lớn, tương phản cao, dùng một tay; thao tác chính ≤3 chạm"]
