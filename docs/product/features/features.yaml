  - code: CRB-01
    name: Emission factor registry
    name_vi: Quản lý hệ số phát thải
    what: >-
      Keep emission factors with their version: Vietnam's grid factor (value,
      year, legal document, effective date) and life-cycle factors of solar,
      wind, biomass and storage; log which version was used for each period.
    what_vi: >-
      Quản lý hệ số phát thải có phiên bản: EF lưới điện Việt Nam (giá trị,
      năm, văn bản công bố, ngày hiệu lực) và EF vòng đời của điện mặt trời,
      gió, sinh khối và BESS; lưu phiên bản đã áp dụng cho từng kỳ.
    value: >-
      Emissions can be recalculated when a factor is republished.
    value_vi: >-
      Tính lại được phát thải khi hệ số được công bố lại.
    users: [OPERATIONS]
    capabilities:
      - ["Versioned factors with legal reference", "Hệ số có phiên bản kèm căn cứ pháp lý"]
