# Feature catalog — single source.
#
# Edit only this file, then regenerate the views (README.md, domains/*.md,
# features.xlsx) with the `feature-catalog` skill. `make check` fails when a
# view is stale or a feature breaks a rule below.
#
# Feature fields (required unless marked optional):
#   code          <PREFIX>-<NN>; the prefix is the feature's domain (below).
#                 Codes are stable: a removed feature's code is never reused.
#   name/name_vi  Short name, English / Vietnamese.
#   what/what_vi  What it does for the user, 1-3 sentences.
#   value/value_vi
#                 Why it matters: who benefits and how (the business effect).
#   users         Roles that use or receive it (see `roles` below).
#   capabilities  The breakdown: list of ["English", "Vietnamese"] pairs.
#   surfaces      Where it is built, each with a status: backend, app
#                 (driver mobile / vehicle app), portal (web portal: fleet,
#                 admin and support console). A surface the feature doesn't
#                 need is left out. Status: todo | doing | done.
#   priority      Must | Should | Could.
#   release       P1.0 (launch) | P1.1 | P1.5 | P2.
#   offer         How it is sold: internal (our staff only, never in a plan),
#                 included (every organization, whatever its plan), tbd (to be
#                 priced: plan, add-on or usage, decided in the pricing work).
#   sources       Where it comes from: "PRD F-A2", "Data IN-1"/"Data OUT-2"
#                 (phase-1-data-inputs-outputs.xlsx), "Phase 2 T1",
#                 "Prerequisite 7", "Decision ID-10" (docs/decisions),
#                 "deferred.md 41", "Design review 2026-10-03".
#   depends_on    (optional) Feature codes that must exist first.
#   touches       (optional) Other backend domains it reads from or writes to.
#   (domains may set sheet_vi: a short Vietnamese sheet name when
#   "<PREFIX> <name_vi>" exceeds Excel's 31 characters)
#   related_tables (optional) DBML tables it uses; filled in after the
#                 database review, empty until then.
#   old_codes     (optional) Codes in the old feature-list.md (F-A1...).
#   questions     (optional) Open questions: ["English", "Vietnamese"] pairs.

roles:
  HEAD_ADMIN: [Head administrator (internal), Quản trị trưởng (nội bộ)]
  CO_ADMIN: [Co-administrator (internal), Đồng quản trị (nội bộ)]
  ORG_ADMIN: [Organization administrator, Quản trị tổ chức]
  SALES: [Sales, Kinh doanh]
  ACCOUNTANT: [Accountant, Kế toán]
  CUSTOMER_CARE: [Customer care, CSKH]
  OPERATIONS: [Operations, Vận hành]
  MAINTENANCE: [Maintenance, Bảo trì]
  WARRANTY: [Warranty, Bảo hành]
  FLEET_MANAGER: [Fleet manager, Quản lý đội xe]
  DISPATCHER: [Dispatcher, Điều vận]
  DRIVER: [Driver, Tài xế]
  TECHNICIAN: [Partner technician, Kỹ thuật viên đối tác]
  SYSTEM: [System (automatic), Hệ thống (tự động)]
  EXTERNAL: [External system, Hệ thống bên ngoài]

domains:
  - prefix: ACC
    key: identity
    name: Accounts & access
    name_vi: Tài khoản & phân quyền
    backend_domain: identity
    summary: >-
      Organizations, people, logins, roles and what each person may see and
      do; consent and audit of personal data.
    summary_vi: >-
      Tổ chức, người dùng, đăng nhập, vai trò và phạm vi mỗi người được xem và
      thao tác; đồng ý xử lý và nhật ký truy cập dữ liệu cá nhân.
  - prefix: VEH
    key: vehicles
    name: Vehicles
    name_vi: Hồ sơ xe
    backend_domain: vehicles
    summary: >-
      The truck's profile, owner and model, and its activation at handover.
    summary_vi: >-
      Hồ sơ xe, chủ sở hữu, dòng xe và kích hoạt xe khi bàn giao.
  - prefix: BAT
    key: batteries
    name: Batteries
    name_vi: Pin
    backend_domain: batteries
    summary: >-
      Each truck battery managed as an asset of its own: its model, owner and
      the trucks it has been fitted to.
    summary_vi: >-
      Quản lý từng pin xe như một tài sản riêng: dòng pin, chủ sở hữu và các
      xe pin đã được lắp.
  - prefix: WAR
    key: warranties
    name: Warranties
    name_vi: Bảo hành
    backend_domain: warranties
    summary: >-
      The warranties of each truck, battery and device: their periods and
      limits, and why a warranty was voided.
    summary_vi: >-
      Bảo hành của từng xe, pin và thiết bị: thời hạn, giới hạn và lý do một
      bảo hành bị hủy.
  - prefix: DEV
    key: telematics
    name: Telematics devices
    name_vi: Thiết bị telematics
    backend_domain: telematics
    summary: >-
      The on-board devices that send vehicle data: registry, mapping to
      vehicles, health, security and remote configuration.
    summary_vi: >-
      Thiết bị gắn trên xe gửi dữ liệu về: danh mục, gắn với xe, sức khỏe
      thiết bị, bảo mật và cấu hình từ xa.
  - prefix: MON
    key: telemetry
    name: Vehicle & battery monitoring
    name_vi: Giám sát xe & pin
    backend_domain: telemetry
    summary: >-
      Live and historical vehicle data, battery and safety alerts, battery
      health, trips and operating reports.
    summary_vi: >-
      Dữ liệu xe theo thời gian thực và lịch sử, cảnh báo pin và an toàn, sức
      khỏe pin, chuyến đi và báo cáo vận hành.
  - prefix: RTE
    key: routing
    name: Range & route planning
    name_vi: Quãng đường & lộ trình
    backend_domain: telemetry
    summary: >-
      How far and how long a truck can still go, whether it reaches its
      destination, where and when to charge, and roads it may not use.
    summary_vi: >-
      Xe còn đi được bao xa, bao lâu, có tới được đích không, nên sạc ở đâu và
      lúc nào, và những đoạn đường cấm tải.
  - prefix: DRV
    key: drivers
    name: Drivers
    name_vi: Tài xế
    backend_domain: drivers
    summary: >-
      Driver profiles, vehicle assignment, shifts, driving time and
      per-driver reports.
    summary_vi: >-
      Hồ sơ tài xế, phân công xe, ca làm việc, thời gian lái và báo cáo theo
      tài xế.
  - prefix: FLT
    key: fleet
    name: Fleet management
    name_vi: Quản lý đội xe
    backend_domain: fleet
    summary: >-
      Groups of trucks inside an organization, their managers, the live fleet
      map, geofences and fleet reports.
    summary_vi: >-
      Nhóm xe trong một tổ chức, người quản lý, bản đồ đội xe, vùng địa lý và
      báo cáo đội xe.
  - prefix: STN
    key: charging_stations
    name: Charging network
    name_vi: Mạng lưới trạm sạc
    backend_domain: charging_stations
    summary: >-
      Stations and chargers, their live status over OCPP, faults, the station
      map, queues, reservations and load.
    summary_vi: >-
      Trạm và trụ sạc, trạng thái realtime qua OCPP, sự cố, bản đồ trạm, hàng
      đợi, đặt chỗ và phân tải.
  - prefix: CHG
    key: charging_sessions
    name: Charging sessions
    name_vi: Phiên sạc
    backend_domain: charging_sessions
    summary: >-
      Starting a charge, the session record, receipts, history, energy per
      customer and reconciliation.
    summary_vi: >-
      Bắt đầu sạc, bản ghi phiên sạc, biên nhận, lịch sử, điện năng theo khách
      hàng và đối soát.
  - prefix: POL
    key: policy
    name: Charging policy & warranty
    name_vi: Chính sách sạc & bảo hành
    backend_domain: policy
    summary: >-
      Warranty-linked charging rules, violation detection with evidence, and
      warranty risk for drivers, fleets and the warranty team.
    summary_vi: >-
      Quy tắc sạc gắn với bảo hành, phát hiện vi phạm kèm bằng chứng, và nguy
      cơ mất bảo hành cho tài xế, đội xe và bộ phận bảo hành.
  - prefix: PAY
    key: billing
    name: Plans, payments & invoices
    name_vi: Gói dịch vụ, thanh toán & hóa đơn
    sheet_vi: Gói, thanh toán & hóa đơn
    backend_domain: billing
    summary: >-
      What customers buy (features, plans, add-ons), how they pay for charging
      and subscriptions, tariffs and e-invoices.
    summary_vi: >-
      Khách hàng mua gì (tính năng, gói, tiện ích thêm), cách thanh toán tiền
      sạc và thuê bao, biểu giá và hóa đơn điện tử.
  - prefix: NTF
    key: notifications
    name: Notifications
    name_vi: Thông báo
    backend_domain: notifications
    summary: >-
      Delivering alerts and messages to the right people on the right channels
      (app, portal, push, SMS, e-mail).
    summary_vi: >-
      Gửi cảnh báo và tin nhắn tới đúng người, đúng kênh (app, portal, push,
      SMS, e-mail).
  - prefix: SUP
    key: support
    name: Support & rescue
    name_vi: CSKH & cứu hộ
    backend_domain: support
    summary: >-
      Support tickets, SOS, the support queue and SLA, and dispatching repair
      and rescue partners.
    summary_vi: >-
      Yêu cầu hỗ trợ, SOS, hàng đợi CSKH và SLA, điều phối đối tác sửa chữa –
      cứu hộ.
  - prefix: MNT
    key: maintenance
    name: Maintenance & asset lifecycle
    name_vi: Bảo dưỡng & vòng đời tài sản
    sheet_vi: Bảo dưỡng & tài sản
    backend_domain: maintenance
    summary: >-
      Maintenance reminders and bookings, repair records, maintenance costs,
      depreciation and component lifetime.
    summary_vi: >-
      Nhắc và đặt lịch bảo dưỡng, hồ sơ sửa chữa, chi phí bảo dưỡng, khấu hao
      và vòng đời vật tư.
  - prefix: SAF
    key: safety
    name: Driver safety & camera
    name_vi: An toàn lái xe & camera
    backend_domain: scoring
    summary: >-
      Driver safety scoring, the driver-monitoring camera, in-cab ADAS alerts,
      evidence clips and the camera's legal obligations.
    summary_vi: >-
      Chấm điểm an toàn lái xe, camera giám sát người lái, cảnh báo ADAS trong
      cabin, clip bằng chứng và nghĩa vụ pháp lý của camera.
  - prefix: CRB
    key: carbon
    name: Carbon & green transition
    name_vi: Kiểm kê carbon & chuyển đổi xanh
    sheet_vi: Carbon & chuyển đổi xanh
    backend_domain: carbon
    summary: >-
      Emissions avoided by electric trucks, green charging, fleet greenhouse
      gas inventory and carbon-credit evidence.
    summary_vi: >-
      Lượng phát thải giảm được nhờ xe điện, sạc xanh, kiểm kê khí nhà kính
      của đội xe và hồ sơ tín chỉ carbon.
  - prefix: PLT
    key: platform
    name: Platform, data & compliance
    name_vi: Nền tảng, dữ liệu & tuân thủ
    sheet_vi: Nền tảng, dữ liệu, tuân thủ
    summary: >-
      The data pipeline and warehouse, system health, data retention, data
      sovereignty and company-wide dashboards.
    summary_vi: >-
      Đường ống và kho dữ liệu, sức khỏe hệ thống, lưu trữ dữ liệu, chủ quyền
      dữ liệu và dashboard toàn công ty.
  - prefix: TMS
    key: tms
    name: Transport management integration (Phase 2)
    name_vi: Tích hợp quản lý vận tải (Phase 2)
    sheet_vi: Tích hợp TMS (Phase 2)
    summary: >-
      Shipments, shippers and depots, built in Phase 2 by integrating with
      the customer's transport management system (TMS), never replacing it.
    summary_vi: >-
      Đơn hàng, chủ hàng và depot, làm ở Phase 2 bằng cách tích hợp với hệ
      thống quản lý vận tải (TMS) của khách hàng, không thay thế TMS.

features:

  # ---------------------------------------------------------------------------
  # ACC — Accounts & access
  # ---------------------------------------------------------------------------

  - code: ACC-01
    name: Organization registry
    name_vi: Danh mục tổ chức
    what: >-
      Record every party that uses the system: companies, owner-drivers,
      individual customers, our own organization and repair partners, stored
      the same way.
    what_vi: >-
      Ghi nhận mọi bên sử dụng hệ thống: doanh nghiệp, chủ xe cá nhân, khách
      lẻ, chính công ty ta và đối tác sửa chữa, lưu theo cùng một cách.
    value: >-
      One model for all customers and partners: data ownership, contracts and
      invoices always point to one organization.
    value_vi: >-
      Một mô hình chung cho mọi khách hàng và đối tác: quyền sở hữu dữ liệu,
      hợp đồng và hóa đơn luôn gắn với một tổ chức.
    users: [SALES, CO_ADMIN, HEAD_ADMIN]
    capabilities:
      - ["Create and edit organizations: names, address, legal form (company or individual)", "Tạo và sửa tổ chức: tên, địa chỉ, loại hình pháp lý (doanh nghiệp hay cá nhân)"]
      - ["Check the tax code against the legal form (company 10/13 digits, individual 12-digit citizen ID)", "Kiểm tra mã số thuế theo loại hình (doanh nghiệp 10/13 số, cá nhân 12 số CCCD)"]
      - ["Status Active / Suspended / Closed, with the reason", "Trạng thái Hoạt động / Tạm ngưng / Đã đóng, kèm lý do"]
      - ["Mark internal organizations, whose users see every organization's data", "Đánh dấu tổ chức nội bộ, người dùng của tổ chức này xem được dữ liệu mọi tổ chức"]
      - ["Keep the full change history of each organization", "Lưu toàn bộ lịch sử thay đổi của từng tổ chức"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [PRD F-F1, Data IN-36, Decision ID-02, Decision ID-03, Decision ID-05, Decision ID-06]
    old_codes: [F-F1]

  - code: ACC-02
    name: Account manager per customer
    name_vi: Nhân viên phụ trách khách hàng
    what: >-
      Assign one of our sales staff to each customer organization and keep a
      record of every reassignment.
    what_vi: >-
      Gán một nhân viên kinh doanh phụ trách mỗi tổ chức khách hàng và lưu lại
      mỗi lần đổi người phụ trách.
    value: >-
      Every customer has a clear owner on our side for contracts, renewals and
      escalations.
    value_vi: >-
      Mỗi khách hàng có một đầu mối rõ ràng phía công ty cho hợp đồng, gia hạn
      và xử lý vướng mắc.
    users: [SALES, CO_ADMIN]
    capabilities:
      - ["Assign or change the account manager of an organization", "Gán hoặc đổi người phụ trách của một tổ chức"]
      - ["List the customers each sales person manages", "Xem danh sách khách hàng mỗi nhân viên kinh doanh phụ trách"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.0
    offer: internal
    depends_on: [ACC-01]
    sources: [Decision ID-07]

  - code: ACC-03
    name: User accounts
    name_vi: Tài khoản người dùng
    what: >-
      One account per person, identified by phone number, used across every
      organization the person works for.
    what_vi: >-
      Mỗi người một tài khoản, định danh bằng số điện thoại, dùng chung cho mọi
      tổ chức người đó làm việc.
    value: >-
      No duplicate accounts when a driver changes or adds employers; one place
      to lock a person out.
    value_vi: >-
      Không trùng tài khoản khi tài xế đổi hoặc làm thêm cho doanh nghiệp khác;
      khóa một người chỉ cần một thao tác.
    users: [HEAD_ADMIN, CO_ADMIN]
    capabilities:
      - ["Profile: full name, phone number (login ID), optional e-mail", "Hồ sơ: họ tên, số điện thoại (tên đăng nhập), e-mail không bắt buộc"]
      - ["Account status Invited / Active / Locked, with the reason; only our administrators lock a whole account", "Trạng thái Đã mời / Hoạt động / Bị khóa, kèm lý do; chỉ quản trị nội bộ được khóa cả tài khoản"]
      - ["Record who created each account and keep its change history", "Ghi nhận ai tạo tài khoản và lưu lịch sử thay đổi"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    sources: [PRD F-F1, Data IN-36, Data IN-49, Decision ID-08]
    old_codes: [F-F1]

  - code: ACC-04
    name: Login and sessions
    name_vi: Đăng nhập & phiên làm việc
    what: >-
      Log in with phone number and password on the app and the portal; a
      person in several organizations picks one after login.
    what_vi: >-
      Đăng nhập bằng số điện thoại và mật khẩu trên app và portal; người thuộc
      nhiều tổ chức chọn một tổ chức sau khi đăng nhập.
    value: >-
      Secure, simple access; every action afterwards is tied to a known person
      and organization.
    value_vi: >-
      Truy cập an toàn, đơn giản; mọi thao tác sau đó đều gắn với một người và
      một tổ chức xác định.
    users: [DRIVER, FLEET_MANAGER, ORG_ADMIN, CUSTOMER_CARE, OPERATIONS]
    capabilities:
      - ["Phone + password login, logout, session expiry", "Đăng nhập bằng SĐT + mật khẩu, đăng xuất, hết hạn phiên"]
      - ["See my logged-in devices and log out one or all of them; every session ends when the password changes or the account is locked", "Xem các thiết bị đang đăng nhập và đăng xuất từng thiết bị hoặc tất cả; mọi phiên kết thúc khi đổi mật khẩu hoặc tài khoản bị khóa"]
      - ["Organization picker after login, remembering the last one", "Chọn tổ chức sau khi đăng nhập, nhớ tổ chức dùng gần nhất"]
      - ["Temporary lockout after repeated failed logins, plus a per-device/IP rate limit; password reset by OTP still works while locked", "Tạm khóa sau nhiều lần đăng nhập sai, kèm giới hạn số lần thử theo thiết bị/IP; vẫn đặt lại mật khẩu bằng OTP được trong lúc bị khóa"]
      - ["Passwords stored only as one-way hashes; old ones cannot be reused", "Mật khẩu chỉ lưu dạng băm một chiều; không dùng lại mật khẩu cũ"]
      - ["Record last login and last activity", "Ghi nhận lần đăng nhập và hoạt động gần nhất"]
      - ["Login history (time, IP, device) visible to the user and our admins; alert the user on a login from a new device", "Lịch sử đăng nhập (thời gian, IP, thiết bị) cho người dùng và quản trị nội bộ xem; báo người dùng khi đăng nhập từ thiết bị mới"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-03]
    sources: [Data IN-49, Decision ID-08, Decision ID-17, Decision ID-18]

  - code: ACC-05
    name: One-time codes (OTP)
    name_vi: Mã xác thực một lần (OTP)
    what: >-
      Send a one-time code by SMS to confirm a phone number when signing up,
      accepting an invitation, resetting a password or changing phone number.
    what_vi: >-
      Gửi mã dùng một lần qua SMS để xác nhận số điện thoại khi đăng ký, nhận
      lời mời, đặt lại mật khẩu hoặc đổi số điện thoại.
    value: >-
      Proves the person owns the phone without ever sending a password by SMS.
    value_vi: >-
      Chứng minh người dùng sở hữu số điện thoại mà không bao giờ gửi mật khẩu
      qua SMS.
    users: [SYSTEM, DRIVER, ORG_ADMIN]
    capabilities:
      - ["Codes are hashed, expire, and work once; 5 wrong attempts kill a code; only the newest code counts", "Mã được băm, có hạn dùng và chỉ dùng một lần; nhập sai 5 lần thì mã hết hiệu lực; chỉ mã mới nhất được tính"]
      - ["Rate limit per phone number against abuse and SMS cost", "Giới hạn số lần gửi theo SĐT để chống lạm dụng và tiết kiệm chi phí SMS"]
      - ["One mechanism for sign-up, invitation, password reset and phone change", "Một cơ chế dùng chung cho đăng ký, lời mời, đặt lại mật khẩu và đổi SĐT"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-03, NTF-03]
    sources: [Data IN-49, Decision ID-16]

  - code: ACC-06
    name: Password reset and phone number change
    name_vi: Đặt lại mật khẩu & đổi số điện thoại
    what: >-
      A user resets a forgotten password or moves the account to a new phone
      number, confirmed by a one-time code.
    what_vi: >-
      Người dùng đặt lại mật khẩu đã quên hoặc chuyển tài khoản sang số điện
      thoại mới, xác nhận bằng mã OTP.
    value: >-
      Users recover access by themselves, without calling support.
    value_vi: >-
      Người dùng tự lấy lại quyền truy cập, không phải gọi CSKH.
    users: [DRIVER, FLEET_MANAGER, ORG_ADMIN]
    capabilities:
      - ["Forgotten password: OTP to the registered phone, then a new password", "Quên mật khẩu: OTP gửi tới SĐT đã đăng ký, rồi đặt mật khẩu mới"]
      - ["Change phone number: OTP to the new number; the change is kept in history", "Đổi SĐT: OTP gửi tới số mới; thay đổi được lưu lịch sử"]
      - ["Change password while logged in", "Đổi mật khẩu khi đang đăng nhập"]
      - ["Extra check by customer care or the organization admin before resetting the password of a long-inactive account (phone numbers get recycled)", "CSKH hoặc quản trị tổ chức xác minh thêm trước khi đặt lại mật khẩu cho tài khoản lâu không hoạt động (số điện thoại có thể bị nhà mạng cấp lại)"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-05]
    sources: [Decision ID-16, Design review 2026-10-03]

  - code: ACC-07
    name: Self-registration for individual customers
    name_vi: Khách lẻ tự đăng ký
    what: >-
      An individual driver signs up in the app with phone number and OTP and
      gets a personal organization on the free default plan.
    what_vi: >-
      Tài xế cá nhân tự đăng ký trên app bằng SĐT và OTP, được tạo một tổ chức
      cá nhân dùng gói mặc định miễn phí.
    value: >-
      Any electric-truck driver can start charging with us without a contract.
    value_vi: >-
      Bất kỳ tài xế xe tải điện nào cũng có thể sạc với chúng ta mà không cần
      hợp đồng.
    users: [DRIVER]
    capabilities:
      - ["Sign up with phone number, OTP and password", "Đăng ký bằng SĐT, OTP và mật khẩu"]
      - ["Create a personal (individual) organization with the user as its administrator and driver", "Tạo tổ chức cá nhân, người dùng là quản trị và tài xế của tổ chức đó"]
      - ["Accept terms and privacy policy at sign-up", "Đồng ý điều khoản và chính sách quyền riêng tư khi đăng ký"]
      - ["Start on the free default plan (charging, wallet, receipts, history)", "Bắt đầu với gói mặc định miễn phí (sạc, ví, biên nhận, lịch sử)"]
    surfaces: {backend: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-01, ACC-05, ACC-17, PAY-02]
    sources: [Decision ID-15, Decision BL-03]

  - code: ACC-08
    name: Company onboarding by sales
    name_vi: Kinh doanh khởi tạo khách hàng doanh nghiệp
    what: >-
      Our sales team creates a company's organization, its subscription and
      its first administrator, who then receives an invitation.
    what_vi: >-
      Nhân viên kinh doanh tạo tổ chức của doanh nghiệp, gói thuê bao và quản
      trị viên đầu tiên; quản trị viên nhận lời mời kích hoạt.
    value: >-
      Contract-led customers are set up correctly from day one.
    value_vi: >-
      Khách hàng ký hợp đồng được thiết lập đúng ngay từ ngày đầu.
    users: [SALES]
    capabilities:
      - ["Create the organization and its subscription in one flow", "Tạo tổ chức và gói thuê bao trong một luồng"]
      - ["Invite the first organization administrator by phone", "Mời quản trị viên đầu tiên của tổ chức qua SĐT"]
      - ["Assign the account manager", "Gán nhân viên phụ trách"]
      - ["The first administrator accepts the data processing agreement for the company at first login", "Quản trị viên đầu tiên chấp thuận thỏa thuận xử lý dữ liệu thay mặt doanh nghiệp ở lần đăng nhập đầu"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [ACC-01, ACC-09, PAY-03]
    sources: [Decision ID-15, Decision BL-04]

  - code: ACC-09
    name: Invite users to an organization
    name_vi: Mời người dùng vào tổ chức
    what: >-
      An organization administrator invites office staff by phone number with
      their roles; the person accepts with an OTP.
    what_vi: >-
      Quản trị tổ chức mời nhân viên văn phòng qua SĐT kèm vai trò; người được
      mời xác nhận bằng OTP.
    value: >-
      Customers manage their own staff; we are not a bottleneck.
    value_vi: >-
      Khách hàng tự quản lý nhân sự của mình; công ty không phải làm thay.
    users: [ORG_ADMIN, CO_ADMIN]
    capabilities:
      - ["Invite by phone number with one or more roles", "Mời qua SĐT kèm một hoặc nhiều vai trò"]
      - ["The invitee joins with OTP; an existing user just gains the new organization", "Người được mời tham gia bằng OTP; người đã có tài khoản chỉ được thêm tổ chức mới"]
      - ["Resend or cancel a pending invitation", "Gửi lại hoặc hủy lời mời đang chờ"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-05, ACC-12, ACC-13]
    sources: [Decision ID-15]

  - code: ACC-10
    name: Driver account claim
    name_vi: Tài xế kích hoạt tài khoản
    what: >-
      A fleet manager registers a driver by phone number; the driver installs
      the app and claims the account with an OTP.
    what_vi: >-
      Quản lý đội xe đăng ký tài xế bằng SĐT; tài xế cài app và kích hoạt tài
      khoản bằng OTP.
    value: >-
      Drivers start using the app with no paperwork or passwords handed out.
    value_vi: >-
      Tài xế dùng app ngay, không cần giấy tờ hay được phát mật khẩu.
    users: [FLEET_MANAGER, DRIVER]
    capabilities:
      - ["Register a driver by phone with the driver role and a driver profile", "Đăng ký tài xế bằng SĐT kèm vai trò tài xế và hồ sơ tài xế"]
      - ["Driver claims the account with OTP and sets a password", "Tài xế kích hoạt bằng OTP và đặt mật khẩu"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-09, DRV-01]
    touches: [drivers]
    sources: [Decision ID-15]

  - code: ACC-11
    name: Bulk import of users and drivers
    name_vi: Nhập hàng loạt người dùng & tài xế
    what: >-
      Our operations team imports a large customer's staff and drivers from a
      spreadsheet.
    what_vi: >-
      Bộ phận vận hành nhập danh sách nhân viên và tài xế của khách hàng lớn từ
      file bảng tính.
    value: >-
      Onboards a big fleet in hours instead of days.
    value_vi: >-
      Đưa một đội xe lớn vào hệ thống trong vài giờ thay vì vài ngày.
    users: [OPERATIONS]
    capabilities:
      - ["Upload a spreadsheet, validate every row, report errors", "Tải lên bảng tính, kiểm tra từng dòng, báo lỗi"]
      - ["Create invitations and driver profiles for valid rows", "Tạo lời mời và hồ sơ tài xế cho các dòng hợp lệ"]
    surfaces: {backend: todo, portal: todo}
    priority: Could
    release: P1.1
    offer: internal
    depends_on: [ACC-09, ACC-10]
    sources: [Decision ID-15]

  - code: ACC-12
    name: Memberships
    name_vi: Thành viên tổ chức
    what: >-
      Record which organizations each person belongs to, when they joined and
      left, and whether their membership is locked.
    what_vi: >-
      Ghi nhận mỗi người thuộc những tổ chức nào, ngày vào, ngày rời và thành
      viên có đang bị khóa không.
    value: >-
      A driver can work for two companies, or move between them, without
      mixing their data.
    value_vi: >-
      Tài xế có thể làm cho hai doanh nghiệp hoặc chuyển giữa các doanh nghiệp
      mà dữ liệu không bị lẫn.
    users: [ORG_ADMIN, CO_ADMIN]
    capabilities:
      - ["List members of an organization with their roles", "Danh sách thành viên của tổ chức kèm vai trò"]
      - ["Lock, unlock or remove a member with a reason (removal keeps history); see when each member was invited and when they joined", "Khóa, mở khóa hoặc cho thành viên rời tổ chức kèm lý do (vẫn giữ lịch sử); xem thời điểm mời và thời điểm tham gia của từng thành viên"]
      - ["A person sees and switches between their organizations", "Người dùng xem và chuyển giữa các tổ chức của mình"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-01, ACC-03]
    sources: [Decision ID-09]

  - code: ACC-13
    name: Role assignment
    name_vi: Gán vai trò
    what: >-
      Give each member one or more job-title roles (driver, fleet manager,
      accountant...), each a fixed bundle of features.
    what_vi: >-
      Gán cho mỗi thành viên một hoặc nhiều vai trò theo chức danh (tài xế,
      quản lý đội xe, kế toán...), mỗi vai trò là một nhóm tính năng cố định.
    value: >-
      The same job gets the same access in every company; special cases are
      covered by combining roles.
    value_vi: >-
      Cùng chức danh thì cùng quyền ở mọi doanh nghiệp; trường hợp đặc biệt xử
      lý bằng cách kết hợp vai trò.
    users: [ORG_ADMIN, CO_ADMIN, HEAD_ADMIN]
    capabilities:
      - ["Grant and revoke roles per membership, with history: who granted or revoked each role, and when", "Gán và thu hồi vai trò theo từng thành viên, có lịch sử: ai đã cấp hoặc thu hồi từng vai trò, và khi nào"]
      - ["Exactly one organization administrator: hand the role over in one step; our co-administrator appoints a new one if the admin is gone", "Đúng một quản trị tổ chức: chuyển giao vai trò trong một bước; đồng quản trị của chúng ta chỉ định người mới khi quản trị viên không còn"]
      - ["Head and co-administrator roles exist only in internal organizations; co-administrators cannot manage administrators", "Vai trò quản trị trưởng và đồng quản trị chỉ có ở tổ chức nội bộ; đồng quản trị không quản lý được quản trị viên"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-12]
    sources: [PRD F-F1, Decision ID-10, Decision ID-12]
    old_codes: [F-F1]

  - code: ACC-14
    name: Feature access control
    name_vi: Kiểm soát quyền dùng tính năng
    what: >-
      Allow a feature only when it is in the person's roles and, for
      customers, also in their organization's plan.
    what_vi: >-
      Chỉ cho dùng một tính năng khi tính năng đó thuộc vai trò của người dùng
      và, với khách hàng, thuộc gói dịch vụ của tổ chức.
    value: >-
      What a customer pays for is exactly what its staff can use.
    value_vi: >-
      Khách hàng trả tiền cho gì thì nhân viên của họ dùng đúng cái đó.
    users: [SYSTEM]
    capabilities:
      - ["Features = role ∩ plan for customers; the whole role for internal users", "Tính năng = vai trò ∩ gói với khách hàng; toàn bộ vai trò với người dùng nội bộ"]
      - ["Internal-only features are never in any plan", "Tính năng chỉ dành cho nội bộ không bao giờ nằm trong gói"]
      - ["A role gives internal and customer users the same features; they differ only in which data they reach. Each role's feature list is granted in one step when nearly all features are built", "Một vai trò cho người dùng nội bộ và khách hàng cùng các tính năng; khác nhau chỉ ở phạm vi dữ liệu được xem. Danh sách tính năng của từng vai trò được cấp trong một bước khi gần hoàn tất các tính năng"]
      - ["The app and portal hide what the user cannot use", "App và portal ẩn những gì người dùng không được dùng"]
      - ["Lock features of an overdue subscription", "Khóa tính năng khi thuê bao quá hạn"]
    surfaces: {backend: todo, portal: todo, app: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-13, PAY-02]
    touches: [billing]
    sources: [PRD F-F1, Decision ID-11, Decision ID-44]
    old_codes: [F-F1]

  - code: ACC-15
    name: Data scope enforcement
    name_vi: Giới hạn phạm vi dữ liệu
    what: >-
      Every query returns only the current organization's data; internal users
      see every organization; fleet-level roles see only their assigned
      fleets.
    what_vi: >-
      Mọi truy vấn chỉ trả dữ liệu của tổ chức đang chọn; người dùng nội bộ
      xem được mọi tổ chức; vai trò cấp đội xe chỉ xem các đội được giao.
    value: >-
      Customers never see each other's trucks, drivers or invoices.
    value_vi: >-
      Khách hàng không bao giờ thấy xe, tài xế hay hóa đơn của nhau.
    users: [SYSTEM]
    capabilities:
      - ["Filter every organization-owned record by the current organization", "Lọc mọi bản ghi thuộc tổ chức theo tổ chức đang chọn"]
      - ["Internal organizations see all organizations, still limited by role", "Tổ chức nội bộ xem mọi tổ chức, vẫn giới hạn theo vai trò"]
      - ["Fleet-level roles limited to their fleets and every fleet below", "Vai trò cấp đội xe chỉ xem đội được giao và các đội cấp dưới"]
    surfaces: {backend: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-12, FLT-03]
    touches: [fleet]
    sources: [Decision ID-11, Decision DM-24]

  - code: ACC-16
    name: Push device registration
    name_vi: Đăng ký thiết bị nhận thông báo đẩy
    what: >-
      Register each phone or browser that should receive push notifications,
      and clean up stale ones.
    what_vi: >-
      Đăng ký từng điện thoại hoặc trình duyệt nhận thông báo đẩy, và dọn các
      thiết bị không còn dùng.
    value: >-
      Push alerts reach the person's current devices and stop after logout.
    value_vi: >-
      Cảnh báo đẩy tới đúng thiết bị đang dùng và dừng sau khi đăng xuất.
    users: [SYSTEM, DRIVER, FLEET_MANAGER]
    capabilities:
      - ["Store the Firebase token on the device's login session, refreshed at login; optional when the user refuses notifications", "Lưu token Firebase trên phiên đăng nhập của thiết bị, làm mới khi đăng nhập; không bắt buộc khi người dùng từ chối thông báo"]
      - ["The token disappears with the session: logout, expiry, password change, account lock, or the app reported uninstalled", "Token mất cùng với phiên: đăng xuất, hết hạn, đổi mật khẩu, khóa tài khoản, hoặc app bị báo đã gỡ"]
      - ["Notifications from all of the person's organizations reach every device; opening one switches to its organization", "Thông báo của mọi tổ chức của người dùng tới mọi thiết bị; mở thông báo sẽ chuyển sang tổ chức của nó"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [ACC-04]
    sources: [Decision ID-19]

  - code: ACC-17
    name: Legal acceptance and consent
    name_vi: Chấp thuận văn bản pháp lý & đồng ý xử lý dữ liệu
    what: >-
      Record who accepted which version of which legal text: a company
      accepts the data processing agreement on its own behalf, an employed
      driver acknowledges the privacy notice, an individual customer accepts
      the terms, privacy policy and location tracking.
    what_vi: >-
      Ghi nhận ai đã chấp thuận phiên bản nào của văn bản pháp lý nào: doanh
      nghiệp chấp thuận thỏa thuận xử lý dữ liệu thay mặt chính mình, tài xế
      là nhân viên xác nhận đã đọc thông báo quyền riêng tư, khách hàng cá
      nhân chấp thuận điều khoản, chính sách quyền riêng tư và theo dõi vị
      trí.
    value: >-
      Proves lawful processing of personal data (Decree 13/2023, Law
      91/2025/QH15) with the exact text accepted.
    value_vi: >-
      Chứng minh việc xử lý dữ liệu cá nhân đúng luật (Nghị định 13/2023, Luật
      91/2025/QH15) bằng đúng văn bản đã được chấp thuận.
    users: [DRIVER, ORG_ADMIN, CO_ADMIN, SYSTEM]
    capabilities:
      - ["Publish versions of each legal text; a new version asks everyone concerned to accept again before continuing", "Công bố các phiên bản của từng văn bản pháp lý; phiên bản mới yêu cầu mọi người liên quan chấp thuận lại trước khi tiếp tục"]
      - ["The organization administrator accepts the data processing agreement for the company at first login; members cannot use the system before", "Quản trị tổ chức chấp thuận thỏa thuận xử lý dữ liệu thay mặt doanh nghiệp ở lần đăng nhập đầu; thành viên chưa dùng được hệ thống trước đó"]
      - ["Employed drivers acknowledge the privacy notice once per version; individual customers consent per purpose", "Tài xế là nhân viên xác nhận đã đọc thông báo quyền riêng tư mỗi phiên bản một lần; khách hàng cá nhân đồng ý theo từng mục đích"]
      - ["Proof kept with each acceptance: exact text version, time, IP and device; never changed", "Bằng chứng lưu kèm mỗi lần chấp thuận: đúng phiên bản văn bản, thời điểm, IP và thiết bị; không bao giờ sửa"]
      - ["Withdrawing a required acceptance means leaving the service (account closure)", "Rút lại chấp thuận bắt buộc nghĩa là ngừng sử dụng dịch vụ (đóng tài khoản)"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    sources: [Data IN-37, NF-08, Decision ID-20, Decision ID-38, Decision ID-43]

  - code: ACC-18
    name: Personal-data access audit log
    name_vi: Nhật ký truy cập dữ liệu cá nhân
    what: >-
      Log who viewed, downloaded or exported which personal, location or
      camera data, when, and for which ticket or reason.
    what_vi: >-
      Ghi lại ai xem, tải hoặc trích xuất dữ liệu cá nhân, vị trí hay hình ảnh
      camera nào, khi nào, vì ticket hoặc lý do gì.
    value: >-
      Required by law; protects drivers and lets us answer any complaint or
      inspection.
    value_vi: >-
      Bắt buộc theo luật; bảo vệ tài xế và giúp công ty trả lời mọi khiếu nại
      hoặc thanh tra.
    users: [SYSTEM, HEAD_ADMIN, CO_ADMIN]
    capabilities:
      - ["Append-only log of every access to personal, location and camera data", "Nhật ký chỉ ghi thêm cho mọi lần truy cập dữ liệu cá nhân, vị trí và camera"]
      - ["Ask for a reason or ticket before exporting sensitive data", "Yêu cầu lý do hoặc mã ticket trước khi trích xuất dữ liệu nhạy cảm"]
      - ["Search the log by person, organization, time and data type", "Tra cứu nhật ký theo người truy cập, tổ chức, thời gian và loại dữ liệu"]
      - ["One entry per screen opened (not per refresh); kept forever, older months compressed", "Ghi một dòng mỗi lần mở màn hình (không ghi mỗi lần làm mới); lưu vĩnh viễn, các tháng cũ được nén"]
      - ["Account security events in the same log: logins, failed logins, lockouts, logouts, password and phone changes, with IP and device", "Sự kiện bảo mật tài khoản trong cùng nhật ký: đăng nhập, đăng nhập sai, bị khóa tạm, đăng xuất, đổi mật khẩu và số điện thoại, kèm IP và thiết bị"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [PRD F-F1, Data OUT-59, NF-08, Decision ID-21]
    old_codes: [F-F1]

  - code: ACC-19
    name: Data-subject requests
    name_vi: Yêu cầu của chủ thể dữ liệu
    what: >-
      Handle a person's requests to see, export, correct or delete their
      personal data.
    what_vi: >-
      Xử lý yêu cầu của một người được xem, xuất, sửa hoặc xóa dữ liệu cá nhân
      của mình.
    value: >-
      Meets the data-subject rights of Decree 13/2023 within the legal
      deadline.
    value_vi: >-
      Đáp ứng quyền của chủ thể dữ liệu theo Nghị định 13/2023 trong thời hạn
      luật định.
    users: [DRIVER, CUSTOMER_CARE, CO_ADMIN]
    capabilities:
      - ["Submit a request from the app", "Gửi yêu cầu từ app"]
      - ["Export a person's data in a readable file", "Xuất dữ liệu của một người ra file đọc được"]
      - ["Delete or anonymize data not required to be kept by law", "Xóa hoặc ẩn danh dữ liệu không bắt buộc phải lưu theo luật"]
      - ["Track each request to completion against its deadline", "Theo dõi từng yêu cầu tới khi hoàn tất so với thời hạn"]
    surfaces: {backend: todo, app: todo, portal: todo}
    priority: Should
    release: P1.1
    offer: included
    depends_on: [ACC-17]
    sources: [NF-08, NF-22]
    questions:
      - ["Which data must be kept despite a deletion request (invoices, sessions, camera records), and for how long?", "Dữ liệu nào phải giữ dù có yêu cầu xóa (hóa đơn, phiên sạc, dữ liệu camera) và giữ trong bao lâu?"]

  - code: ACC-20
    name: Emergency administrator access
    name_vi: Tài khoản quản trị khẩn cấp
    what: >-
      A sealed head-administrator account kept offline and used only when the
      owner cannot be reached; every use is logged.
    what_vi: >-
      Một tài khoản quản trị trưởng được niêm phong, cất ngoại tuyến, chỉ dùng
      khi không liên lạc được chủ sở hữu; mọi lần dùng đều được ghi lại.
    value: >-
      An administrator account compromise can be fixed even when the owner is
      away.
    value_vi: >-
      Có thể xử lý khi tài khoản quản trị bị chiếm quyền kể cả khi chủ sở hữu
      vắng mặt.
    users: [HEAD_ADMIN]
    capabilities:
      - ["Create and seal the emergency account before go-live", "Tạo và niêm phong tài khoản khẩn cấp trước khi vận hành chính thức"]
      - ["Alert the owners whenever it logs in", "Báo cho chủ sở hữu mỗi khi tài khoản này đăng nhập"]
    surfaces: {backend: todo}
    priority: Should
    release: P1.0
    offer: internal
    sources: [Decision IS-11]

  - code: ACC-21
    name: API access for partners and systems
    name_vi: Truy cập API cho đối tác & hệ thống
    what: >-
      Issue API credentials to a partner's or customer's software (rescue
      partners, TMS, regulators) with limited permissions.
    what_vi: >-
      Cấp thông tin truy cập API cho phần mềm của đối tác hoặc khách hàng (đối
      tác cứu hộ, TMS, cơ quan quản lý) với quyền hạn giới hạn.
    value: >-
      Partners and customers connect their systems without sharing a person's
      login.
    value_vi: >-
      Đối tác và khách hàng kết nối hệ thống mà không phải dùng chung tài khoản
      của một người.
    users: [CO_ADMIN, EXTERNAL]
    capabilities:
      - ["Create, rotate and revoke API keys per organization", "Tạo, đổi và thu hồi khóa API theo tổ chức"]
      - ["Limit each key to named features", "Giới hạn mỗi khóa theo các tính năng được phép"]
      - ["Log every API call", "Ghi lại mọi lời gọi API"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.1
    offer: tbd
    depends_on: [ACC-14]
    sources: [NF-21, Decision SP-06]

  - code: ACC-22
    name: Change history viewer
    name_vi: Xem lịch sử thay đổi
    what: >-
      Show who changed an organization, a user, a role or another audited
      record, when, and what it looked like before.
    what_vi: >-
      Hiển thị ai đã thay đổi một tổ chức, người dùng, vai trò hoặc bản ghi
      được lưu lịch sử, khi nào và trước đó ra sao.
    value: >-
      Disputes and mistakes are traced in minutes, without database access.
    value_vi: >-
      Truy ra tranh chấp và sai sót trong vài phút, không cần truy cập cơ sở
      dữ liệu.
    users: [CO_ADMIN, HEAD_ADMIN, CUSTOMER_CARE]
    capabilities:
      - ["Timeline of changes per record, with the acting user", "Dòng thời gian thay đổi của từng bản ghi, kèm người thực hiện"]
      - ["Compare any old version with the current one", "So sánh một phiên bản cũ với hiện tại"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.1
    offer: internal
    sources: [Decision DM-15]

  # ---------------------------------------------------------------------------
  # VEH — Vehicles
  # ---------------------------------------------------------------------------

  - code: VEH-01
    name: Vehicle registry
    name_vi: Danh mục xe
    what: >-
      Keep every truck's profile: VIN, plate, model, handover date, warranty
      status and service status.
    what_vi: >-
      Lưu hồ sơ từng xe: số VIN, biển số, dòng xe, ngày bàn giao, trạng thái
      bảo hành và trạng thái phục vụ.
    value: >-
      Every alert, session and report points to one well-identified truck.
    value_vi: >-
      Mọi cảnh báo, phiên sạc và báo cáo đều gắn với một xe được định danh rõ
      ràng.
    users: [OPERATIONS, FLEET_MANAGER, ORG_ADMIN]
    capabilities:
      - ["Create, edit, search and retire vehicles", "Tạo, sửa, tìm kiếm và ngừng sử dụng xe"]
      - ["VIN and plate unique among live trucks and both editable (typing mistakes, plates that follow the owner); history of changes with a reason", "VIN và biển số không trùng trong các xe đang dùng và đều sửa được (nhập nhầm, biển số theo chủ xe); lưu lịch sử thay đổi kèm lý do"]
      - ["Service status set by a person: active, under maintenance, decommissioned, with a reason; idle or silent trucks are shown from their data, not stored", "Trạng thái phục vụ do con người đặt: đang phục vụ, đang bảo dưỡng, đã rời hệ thống, kèm lý do; xe nhàn rỗi hay mất tín hiệu được hiển thị từ dữ liệu, không lưu"]
      - ["Filter by status, model, owner and fleet", "Lọc theo trạng thái, dòng xe, chủ sở hữu và đội xe"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    sources: [Data IN-32, PRD F-F2, Decision VH-05, Decision VH-07]
    old_codes: [F-F2]

  - code: VEH-02
    name: Vehicle ownership
    name_vi: Chủ sở hữu xe
    what: >-
      Each truck has exactly one owning organization; ownership can be
      transferred and every transfer is kept.
    what_vi: >-
      Mỗi xe có đúng một tổ chức sở hữu; quyền sở hữu có thể chuyển và mọi lần
      chuyển đều được lưu.
    value: >-
      Clear responsibility and data ownership, even when trucks are sold or
      leased.
    value_vi: >-
      Trách nhiệm và quyền sở hữu dữ liệu rõ ràng, kể cả khi xe được bán hoặc
      cho thuê.
    users: [OPERATIONS, SALES]
    capabilities:
      - ["Record the owner at handover", "Ghi nhận chủ sở hữu khi bàn giao"]
      - ["Transfer ownership with an effective date in one step: the seller's fleet memberships, driving session, charging rules, subscription and VIN charging credential for the truck end at once", "Chuyển quyền sở hữu kèm ngày hiệu lực trong một bước: tư cách thành viên đội xe, phiên lái, quy tắc sạc, thuê bao và thẻ sạc theo VIN của bên bán đối với xe kết thúc cùng lúc"]
      - ["The previous owner keeps its own data from before the sale; the truck's condition and lifetime totals follow it to the new owner; every ownership period with who recorded it and why", "Chủ cũ giữ dữ liệu của mình trước ngày bán; tình trạng xe và các tổng tích lũy đi theo xe sang chủ mới; mọi giai đoạn sở hữu kèm người ghi nhận và lý do"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [VEH-01, ACC-01]
    sources: [Data IN-32, Decision VH-03, Decision VH-10, Decision VH-11, Decision VH-12]

  - code: VEH-03
    name: Vehicle model catalog
    name_vi: Danh mục dòng xe
    what: >-
      Store each truck model's specifications (EVT-262/400/825): battery
      capacity and consumption curve by load (electric figures only).
    what_vi: >-
      Lưu thông số từng dòng xe (EVT-262/400/825): dung lượng pin, đường cong
      tiêu thụ theo tải (chỉ số liệu xe điện).
    value: >-
      Reports and forecasts use manufacturer-confirmed figures instead of
      defaults.
    value_vi: >-
      Báo cáo và dự báo dùng số liệu nhà sản xuất xác nhận thay vì giá trị mặc
      định.
    users: [OPERATIONS]
    capabilities:
      - ["Model specifications confirmed by the manufacturer", "Thông số dòng xe được nhà sản xuất xác nhận"]
      - ["Consumption reference curve by load, used by forecasts and empty-trip detection", "Đường cong tiêu thụ tham chiếu theo tải, dùng cho dự báo và phát hiện chạy rỗng"]
    surfaces: {backend: todo, portal: todo}
    priority: Should
    release: P1.0
    offer: internal
    depends_on: [VEH-01]
    sources: [Data IN-32, Data IN-34, deferred.md 61, Decision VH-08, Decision VH-15]

  - code: VEH-05
    name: Vehicle activation
    name_vi: Kích hoạt xe
    what: >-
      Follow each truck from registration to device assignment to its first
      data received, and report the activation success rate.
    what_vi: >-
      Theo dõi từng xe từ khi đăng ký, gắn thiết bị tới khi nhận dữ liệu đầu
      tiên, và báo cáo tỷ lệ kích hoạt thành công.
    value: >-
      No truck leaves handover without working data; target ≥98% activation
      success.
    value_vi: >-
      Không xe nào rời bàn giao khi chưa có dữ liệu; mục tiêu kích hoạt thành
      công ≥98%.
    users: [OPERATIONS, SYSTEM]
    capabilities:
      - ["Activation computed from the device fitted now and the data received, so a truck whose T-Box was removed shows it", "Kích hoạt được tính từ thiết bị đang lắp và dữ liệu đã nhận, nên xe bị tháo T-Box sẽ hiện đúng như vậy"]
      - ["Activation success rate and the list of trucks still waiting", "Tỷ lệ kích hoạt thành công và danh sách xe còn đang chờ"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [VEH-01, DEV-02]
    touches: [telematics, telemetry]
    sources: [PRD F-F2, Decision VH-06]
    old_codes: [F-F2]

  - code: VEH-06
    name: Fault code catalog
    name_vi: Bảng mã lỗi
    what: >-
      The manufacturer's fault code (DTC) table: description, severity,
      whether the truck can keep driving, and what to do.
    what_vi: >-
      Bảng mã lỗi (DTC) của nhà sản xuất: mô tả, mức nghiêm trọng, xe có tiếp
      tục chạy được không và hướng xử lý.
    value: >-
      Turns raw error codes into clear alerts and instructions for drivers and
      support.
    value_vi: >-
      Biến mã lỗi thô thành cảnh báo và hướng dẫn rõ ràng cho tài xế và CSKH.
    users: [OPERATIONS, CUSTOMER_CARE, WARRANTY]
    capabilities:
      - ["Import and version the manufacturer's DTC table", "Nhập và quản lý phiên bản bảng DTC của nhà sản xuất"]
      - ["Severity, drivability verdict and handling advice per code", "Mức nghiêm trọng, kết luận xe chạy tiếp được không và hướng xử lý theo từng mã"]
      - ["Standard motor states list", "Danh sách chuẩn trạng thái motor"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [Data IN-16, Data IN-34, Prerequisite 1, deferred.md 42]
    questions:
      - ["The manufacturer must deliver the DTC table with severities in writing (prerequisite 1).", "Nhà sản xuất phải cung cấp bằng văn bản bảng DTC kèm mức nghiêm trọng (điều kiện tiên quyết 1)."]

  # ---------------------------------------------------------------------------
  # BAT — Batteries
  # ---------------------------------------------------------------------------

  - code: BAT-01
    name: Battery registry
    name_vi: Hồ sơ pin
    what: >-
      Manage each truck battery as an asset: its model, owner and the trucks
      it has been fitted to.
    what_vi: >-
      Quản lý từng pin xe như một tài sản: dòng pin, chủ sở hữu và các xe pin
      đã được lắp.
    value: >-
      The battery is up to two thirds of a truck's price; its health,
      warranty and value follow it from truck to truck.
    value_vi: >-
      Pin chiếm tới hai phần ba giá xe; sức khỏe, bảo hành và giá trị của pin
      đi theo pin từ xe này sang xe khác.
    users: [OPERATIONS, MAINTENANCE, WARRANTY]
    capabilities:
      - ["Battery model catalog: chemistry (LFP/CATL), design capacity, voltage, layout", "Danh mục dòng pin: hóa học (LFP/CATL), dung lượng thiết kế, điện áp, cấu trúc"]
      - ["Each battery: serial number, model, owner (may differ from the truck's owner), status with a reason", "Từng pin: số serial, dòng pin, chủ sở hữu (có thể khác chủ xe), trạng thái kèm lý do"]
      - ["One battery per truck; history of which truck each battery was installed in", "Mỗi xe một pin; lịch sử pin đã được lắp trên xe nào"]
      - ["A battery owned by the seller moves to the buyer when its truck is sold", "Pin thuộc bên bán chuyển sang bên mua khi xe được bán"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [VEH-01]
    sources: [Data IN-33, Decision VH-08, Decision VH-13, Decision VH-16, deferred.md 87, deferred.md 88]
    questions:
      - ["Does the truck's BMS report the pack serial number through the T-Box? If so, an unrecorded battery swap can raise an alert.", "BMS của xe có gửi số serial của pin qua T-Box không? Nếu có, việc thay pin không được ghi nhận có thể phát cảnh báo."]


  # ---------------------------------------------------------------------------
  # WAR — Warranties
  # ---------------------------------------------------------------------------

  - code: WAR-01
    name: Warranty register
    name_vi: Sổ bảo hành
    what: >-
      Keep every warranty of a truck, its battery and its devices: period,
      limits such as distance or charge cycles, and its status, with the
      reason when a warranty is voided.
    what_vi: >-
      Lưu mọi bảo hành của xe, pin và thiết bị trên xe: thời hạn, các giới hạn
      như quãng đường hay số chu kỳ sạc, và trạng thái, kèm lý do khi bảo hành
      bị hủy.
    value: >-
      Everyone knows what is still covered; a voided warranty is explained
      and provable.
    value_vi: >-
      Mọi bên đều biết những gì còn được bảo hành; bảo hành bị hủy có lý do rõ
      ràng và chứng minh được.
    users: [WARRANTY, OPERATIONS, FLEET_MANAGER]
    capabilities:
      - ["Warranties per truck, battery and device, set per truck, each with its own period and limits", "Bảo hành theo từng xe, pin và thiết bị, đặt riêng cho từng xe, mỗi bảo hành có thời hạn và giới hạn riêng"]
      - ["Expiry computed from the date and the truck's or battery's counters; voiding with a reason and history", "Hết hạn được tính từ ngày và bộ đếm của xe hoặc pin; hủy bảo hành kèm lý do và lịch sử"]
      - ["A battery's warranty follows the battery to another truck", "Bảo hành của pin đi theo pin sang xe khác"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: included
    depends_on: [VEH-01, BAT-01]
    sources: [Data IN-32, Decision VH-09, Decision VH-14, Decision VH-18]

  # ---------------------------------------------------------------------------
  # DEV — Telematics devices
  # ---------------------------------------------------------------------------

  - code: DEV-01
    name: Device registry
    name_vi: Danh mục thiết bị
    what: >-
      Keep every telematics device: serial, IMEI, SIM/ICCID, firmware and
      status.
    what_vi: >-
      Lưu từng thiết bị telematics: số serial, IMEI, SIM/ICCID, firmware và
      trạng thái.
    value: >-
      Operations know which device is where and in what condition.
    value_vi: >-
      Bộ phận vận hành biết thiết bị nào ở đâu và đang ở tình trạng nào.
    users: [OPERATIONS]
    capabilities:
      - ["Create, edit, search and retire devices", "Tạo, sửa, tìm kiếm và ngừng sử dụng thiết bị"]
      - ["Unique serial; retired devices keep their history", "Serial không trùng; thiết bị ngừng dùng vẫn giữ lịch sử"]
      - ["Each device has its own owner, the truck's owner or G3; a device the seller owns moves with the truck when it is sold", "Mỗi thiết bị có chủ sở hữu riêng, là chủ xe hoặc G3; thiết bị thuộc bên bán đi theo xe khi bán xe"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [Data IN-19, Data IN-20, Data IN-21, PRD F-G1, Decision TX-07, Decision TX-08]
    old_codes: [F-G1]

  - code: DEV-02
    name: Device-to-vehicle assignment
    name_vi: Gắn thiết bị với xe
    what: >-
      Link a device to a truck at handover, replace it when needed, and keep
      the history of which device served which truck.
    what_vi: >-
      Gắn thiết bị với xe khi bàn giao, thay thiết bị khi cần và lưu lịch sử
      thiết bị nào đã gắn với xe nào.
    value: >-
      Data from a device always lands on the right truck.
    value_vi: >-
      Dữ liệu từ thiết bị luôn được ghi đúng xe.
    users: [OPERATIONS]
    capabilities:
      - ["One live device per truck", "Mỗi xe chỉ có một thiết bị đang hoạt động"]
      - ["Assign, unassign and replace, with history", "Gắn, gỡ và thay thiết bị, có lịch sử"]
    surfaces: {backend: todo, portal: todo}
    priority: Must
    release: P1.0
    offer: internal
    depends_on: [DEV-01, VEH-01]
    touches: [vehicles]
    sources: [Data IN-19, PRD F-G1, Decision TX-02, Decision TX-08]
    old_codes: [F-G1]

  - code: DEV-03
    name: Telematics data integration
    name_vi: Tích hợp dữ liệu telematics
    what: >-
      Receive data from the Tri-Ring on-board unit over a defined, versioned
      contract, switchable between a simulator and real trucks.
    what_vi: >-
      Nhận dữ liệu từ thiết bị trên xe Tri-Ring theo hợp đồng dữ liệu được
      định nghĩa và có phiên bản, chuyển đổi được giữa giả lập và xe thật.
    value: >-
      Every monitoring feature depends on this; the swappable interface lets
      us build before the real spec is final.
    value_vi: >-
      Mọi tính năng giám sát phụ thuộc vào đây; giao diện thay thế được cho
      phép xây dựng trước khi có đặc tả chính thức.
    users: [SYSTEM]
    capabilities:
      - ["Versioned message contract (fields, units, frequency)", "Hợp đồng bản tin có phiên bản (trường, đơn vị, tần suất)"]
      - ["Simulator and real device behind the same interface", "Giả lập và thiết bị thật dùng chung một giao diện"]
      - ["All core fields received in full", "Nhận đủ toàn bộ trường dữ liệu cốt lõi"]
    surfaces: {backend: todo}
    priority: Must
    release: P1.0
    offer: internal
    sources: [PRD F-G1, Data IN-17, Prerequisite 1]
    old_codes: [F-G1]
    questions:
      - ["The Tri-Ring telematics spec (fields, frequency, protocol, BMS access) is not signed off; fallback is a third-party OBD/CAN gateway.", "Đặc tả telematics của Tri-Ring (trường, tần suất, giao thức, quyền truy cập BMS) chưa được chốt; phương án dự phòng là gateway OBD/CAN bên thứ ba."]

  - code: DEV-04
    name: Device health dashboard
    name_vi: Dashboard sức khỏe thiết bị
    what: >-
      Per-device view of last seen, online/silent, firmware, SIM and data
