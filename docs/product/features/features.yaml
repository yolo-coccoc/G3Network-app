      dưới đội khác (vùng, chi nhánh, bãi).
    value: >-
      Each customer models its own structure as data; reorganizing changes
      nothing in the system.
    value_vi: >-
      Mỗi khách hàng tự mô tả cơ cấu của mình bằng dữ liệu; tổ chức lại không
