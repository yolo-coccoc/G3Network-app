  - code: CHG-06
    name: Three-way reconciliation
    name_vi: Đối soát 3 chiều
    what: >-
      Match kWh between the charger, the truck's own data and the payment;
      alert when they differ by 1% or more.
    what_vi: >-
      Đối chiếu kWh giữa trụ sạc, dữ liệu của xe và thanh toán; cảnh báo khi
