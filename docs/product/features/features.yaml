  # ---------------------------------------------------------------------------
  # SAF — Driver safety & camera
  # ---------------------------------------------------------------------------

  - code: SAF-01
    name: Driver safety score
    name_vi: Điểm an toàn lái xe
    what: >-
      A 0–100 safety score per driver from hard braking, sudden acceleration,
      sharp cornering, speeding and over-4-hour driving, normalized per 100
      km, merged with camera events where the advanced package is used; a
      manager view and a driver's own view.
    what_vi: >-
      Điểm an toàn 0–100 cho mỗi tài xế từ phanh gấp, tăng tốc đột ngột, vào
      cua gấp, quá tốc độ và lái liên tục quá 4 giờ, chuẩn hóa theo 100 km, gộp
      với sự kiện camera khi dùng gói nâng cao; có khung nhìn quản lý và của
      chính tài xế.
    value: >-
      Safer driving, fewer accidents; later a basis for insurance pricing.
    value_vi: >-
      Lái xe an toàn hơn, ít tai nạn hơn; sau này làm căn cứ định giá bảo
      hiểm.
    users: [FLEET_MANAGER, DRIVER, SYSTEM]
    capabilities:
      - ["Event detection from acceleration, speed and route limits", "Phát hiện sự kiện từ gia tốc, tốc độ và giới hạn tốc độ của tuyến"]
      - ["Configurable weights; fixed thresholds per model at first, recalibrated on real data", "Trọng số cấu hình được; ban đầu ngưỡng cố định theo dòng xe, sau hiệu chỉnh theo dữ liệu thực"]
      - ["Weekly report and fleet ranking", "Báo cáo tuần và xếp hạng trong đội"]
