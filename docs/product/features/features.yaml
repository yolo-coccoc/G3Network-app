    what_vi: >-
      Lập lịch ngày làm việc và ca của tài xế.
    value: >-
      Dispatchers see who is available and plan rest properly.
    value_vi: >-
      Điều vận biết ai đang sẵn sàng và bố trí nghỉ ngơi hợp lý.
    users: [DISPATCHER, FLEET_MANAGER, DRIVER]
