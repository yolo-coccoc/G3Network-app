    target: ["Range error ≤10% p50 / ≤15% p90; station-load forecast measured weekly; every model retrainable", "Sai số quãng đường ≤10% p50 / ≤15% p90; dự báo tải trạm đo hằng tuần; mọi mô hình huấn luyện lại được"]
    features: [RTE-01, RTE-05, RTE-06, STN-08]
  - code: NF-21
    category: [Integration, Tích hợp]
    requirement: [Partner integration, Tích hợp đối tác]
    target: ["Standard repair/rescue intake API; ≤15-minute acceptance; swapping partners needs no code change", "API tiếp nhận sửa chữa/cứu hộ chuẩn; nhận ca ≤15 phút; đổi đối tác không cần sửa code"]
    features: [SUP-04, SUP-05, SUP-06]
  - code: NF-22
    category: [Security & compliance, Bảo mật & tuân thủ]
    requirement: [Data governance, Quản trị dữ liệu]
    target: ["Encryption, role-based access, audit log, retention policy, driver consent at activation", "Mã hóa, phân quyền theo vai trò, nhật ký truy cập, chính sách lưu trữ, tài xế đồng ý khi kích hoạt"]
    features: [ACC-14, ACC-17, ACC-18, PLT-04]
