<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charger Simulator</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #5f6b7a;
    --line: #e1e5eb; --ok: #1a7f37; --ok-bg: #dafbe1;
    --warn: #9a6700; --warn-bg: #fff8c5; --bad: #cf222e; --bad-bg: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --line: #30363d; --ok: #3fb950; --ok-bg: #12261e;
      --warn: #d29922; --warn-bg: #272115; --bad: #f85149; --bad-bg: #2d1416;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
  }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; }
  .field .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field .value { font-weight: 600; overflow-wrap: anywhere; }
  #offline { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Charger Simulator</h1>
    <span id="connection" class="pill warn">starting</span>
  </header>

  <div id="offline" class="card"><span class="pill bad">simulator not running</span>
    <span class="muted">The page cannot reach the simulator. Start it again; this page reconnects by itself.</span></div>

  <section class="card">
    <h2>Welcome</h2>
    <p id="welcome" class="muted">Loading…</p>
    <div class="grid">
      <div class="field"><div class="label">Charger ID</div><div class="value" id="f-id">-</div></div>
      <div class="field"><div class="label">Vendor / model</div><div class="value" id="f-model">-</div></div>
      <div class="field"><div class="label">Firmware</div><div class="value" id="f-firmware">-</div></div>
      <div class="field"><div class="label">Serial</div><div class="value" id="f-serial">-</div></div>
      <div class="field"><div class="label">Server</div><div class="value" id="f-endpoint">-</div></div>
      <div class="field"><div class="label">Switched on</div><div class="value" id="f-on">-</div></div>
      <div class="field"><div class="label">Connected since</div><div class="value" id="f-since">-</div></div>
      <div class="field"><div class="label">Connections</div><div class="value" id="f-connections">-</div></div>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const time = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour12: false}) : "-";
  const dateTime = (iso) => iso ? new Date(iso).toLocaleString([], {hour12: false}) : "-";

  function renderConnection(connection) {
    const pill = $("connection");
    const labels = {connected: ["connected", "ok"], connecting: ["connecting…", "warn"], disconnected: ["disconnected", "bad"]};
    const [label, kind] = labels[connection.status] || [connection.status, "warn"];
    pill.textContent = label;
    pill.className = `pill ${kind}`;
    pill.title = connection.detail || "";
  }

  function renderWelcome(data) {
    const c = data.charger, conn = data.connection;
    document.title = `${c.id} · Charger Simulator`;
    $("title").textContent = `Charger ${c.id}`;
    let text = `Welcome. This charger was switched on at ${dateTime(c.powered_on_at)} and talks OCPP 1.6J to ${c.endpoint}.`;
    if (conn.status === "disconnected") {
      text += ` It is offline: ${conn.detail}. Next try at ${time(conn.next_retry_at)}.`;
    } else if (conn.status === "connecting") {
      text += " It is connecting now.";
    }
    $("welcome").textContent = text;
    $("f-id").textContent = c.id;
    $("f-model").textContent = `${c.vendor} / ${c.model}`;
    $("f-firmware").textContent = c.firmware;
    $("f-serial").textContent = c.serial || "not sent";
    $("f-endpoint").textContent = c.endpoint;
    $("f-on").textContent = dateTime(c.powered_on_at);
    $("f-since").textContent = dateTime(conn.connected_since);
    $("f-connections").textContent = conn.connections;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/state", {cache: "no-store"});
      if (!response.ok) throw new Error(response.statusText);
      const data = await response.json();
      $("offline").style.display = "none";
      renderConnection(data.connection);
      renderWelcome(data);
    } catch (error) {
      $("offline").style.display = "block";
      $("connection").textContent = "unreachable";
      $("connection").className = "pill bad";
    }
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
