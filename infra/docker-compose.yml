services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: g3network-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-g3network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-g3network123}
      POSTGRES_DB: ${POSTGRES_DB:-g3network}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-g3network} -d ${POSTGRES_DB:-g3network}"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: emqx/emqx:5.5
    container_name: g3network-broker
    restart: unless-stopped
    environment:
      EMQX_NAME: g3network-broker
      EMQX_HOST: 0.0.0.0
    ports:
      - "1883:1883"    # MQTT port
      - "18083:18083"  # Dashboard port
    volumes:
      - broker_data:/opt/emqx/data
      - broker_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  broker_data:
  broker_log:
