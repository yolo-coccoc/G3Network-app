services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: g3network-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-g3network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-g3network123}
      POSTGRES_DB: ${POSTGRES_DB:-g3network}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-g3network} -d ${POSTGRES_DB:-g3network}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
