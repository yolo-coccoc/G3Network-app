# `make coverage`: measure the application package only, and list the
# uncovered lines of each file in the terminal report.
[tool.coverage.run]
source = ["app"]
omit = ["app/libs/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
