[project]
name = "g3network-backend"
version = "0.1.0"
description = "Backend for G3Network - Electric truck driver support system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "aiomqtt>=2.3.0",
    # The MobilityHouse library's package name on PyPI is ``ocpp``.
    "ocpp>=2.0.0",
    "websockets>=16.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
]

# Development tools. A dependency *group* (PEP 735), not an optional extra:
# `uv sync` installs the `dev` group by default, so a plain sync can never
# uninstall the tools `make check` and the pre-commit hook need.
[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "import-linter>=2.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff is the single formatter + linter (it replaced Black and isort on
# 2026-10-01). The "I" rules sort imports the way isort's black profile did.
# The bootstrap-phase baseline migration is formatted like any other file:
# it is edited in place, so there is no merged history to protect.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# I: import sorting. ICN003: enforce backend-coding-conventions.md §9 - a
# domain's service/repository is imported as a module alias
# (`import app.domains.x.service as x_service`), never
# `from app.domains.x import service` or `from app.domains.x.service import f`.
extend-select = ["I", "ICN003"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = [
    "app.domains.batteries",
    "app.domains.batteries.service",
    "app.domains.batteries.repository",
    "app.domains.billing",
    "app.domains.billing.service",
    "app.domains.billing.repository",
    "app.domains.charging_sessions",
    "app.domains.charging_sessions.service",
    "app.domains.charging_sessions.repository",
    "app.domains.charging_stations",
    "app.domains.charging_stations.service",
    "app.domains.charging_stations.repository",
    "app.domains.drivers",
    "app.domains.drivers.service",
    "app.domains.drivers.repository",
    "app.domains.fleet",
    "app.domains.fleet.service",
    "app.domains.fleet.repository",
    "app.domains.identity",
    "app.domains.identity.service",
    "app.domains.identity.repository",
    "app.domains.notifications",
    "app.domains.notifications.service",
    "app.domains.notifications.repository",
    "app.domains.support",
    "app.domains.support.service",
    "app.domains.support.repository",
    "app.domains.telematics",
    "app.domains.telematics.service",
    "app.domains.telematics.repository",
    "app.domains.telemetry",
    "app.domains.telemetry.service",
    "app.domains.telemetry.repository",
    "app.domains.vehicles",
    "app.domains.vehicles.service",
    "app.domains.vehicles.repository",
    "app.domains.warranties",
    "app.domains.warranties.service",
    "app.domains.warranties.repository",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

# The ``ocpp`` library (MobilityHouse) does not ship type stubs or
# `py.typed`, so mypy strict cannot analyze its submodules.
[[tool.mypy.overrides]]
module = "ocpp.*"
ignore_missing_imports = true

# ``shapely`` (used to build/read PostGIS geography points in the
# charging_stations domain, F-C1) does not ship type stubs either.
[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

# Domain boundaries (.claude/rules/domain-boundaries.md): another domain may
# use only a domain's public surface - service.py, plus the DTOs/enums of
# types.py and the exceptions of exceptions.py - never its repository,
# models, router, schemas or internal modules (e.g. telemetry.detection,
# charging_stations.ocpp_state_service, the ocpp/ and ingestion/ packages).
# One contract per domain; a NEW module in a domain must be added to that
# domain's forbidden_modules unless it is meant to be public.
# allow_indirect_imports keeps the legitimate chain "fleet -> vehicles.service
# -> vehicles.repository" from counting: only direct imports are checked.
# Run: make lint.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Other domains use only charging_sessions's service, types and exceptions"
type = "forbidden"
source_modules = ["app.domains.batteries", "app.domains.billing", "app.domains.charging_stations", "app.domains.drivers", "app.domains.fleet", "app.domains.identity", "app.domains.notifications", "app.domains.support", "app.domains.telematics", "app.domains.telemetry", "app.domains.vehicles", "app.domains.warranties"]
forbidden_modules = [
    "app.domains.charging_sessions.models",
    "app.domains.charging_sessions.repository",
    "app.domains.charging_sessions.router",
    "app.domains.charging_sessions.schemas",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Other domains use only charging_stations's service, types and exceptions"
type = "forbidden"
source_modules = ["app.domains.batteries", "app.domains.billing", "app.domains.charging_sessions", "app.domains.drivers", "app.domains.fleet", "app.domains.identity", "app.domains.notifications", "app.domains.support", "app.domains.telematics", "app.domains.telemetry", "app.domains.vehicles", "app.domains.warranties"]
forbidden_modules = [
    "app.domains.charging_stations.models",
    "app.domains.charging_stations.ocpp",
    "app.domains.charging_stations.ocpp_state_repository",
    "app.domains.charging_stations.ocpp_state_service",
    "app.domains.charging_stations.repository",
    "app.domains.charging_stations.router",
    "app.domains.charging_stations.schemas",
]
allow_indirect_imports = true

