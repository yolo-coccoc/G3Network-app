[project]
name = "g3network-backend"
version = "0.1.0"
description = "Backend for G3Network - Electric truck driver support system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "aiomqtt>=2.3.0",
    # The MobilityHouse library's package name on PyPI is ``ocpp``.
    "ocpp>=2.0.0",
    "websockets>=16.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "import-linter>=2.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff is the single formatter + linter (it replaced Black and isort on
# 2026-10-01). The "I" rules sort imports the way isort's black profile did.
# The bootstrap-phase baseline migration is formatted like any other file:
# it is edited in place, so there is no merged history to protect.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

# The ``ocpp`` library (MobilityHouse) does not ship type stubs or
# `py.typed`, so mypy strict cannot analyze its submodules.
[[tool.mypy.overrides]]
module = "ocpp.*"
ignore_missing_imports = true

# ``shapely`` (used to build/read PostGIS geography points in the
# charging_stations domain, F-C1) does not ship type stubs either.
[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

# Domain boundaries (.claude/rules/domain-boundaries.md): another domain may
# use a domain's service.py (and the DTOs/enums of its types.py), never its
# repository or models. One contract per domain. allow_indirect_imports keeps
# the legitimate chain "fleet -> vehicles.service -> vehicles.repository" from
# counting as a violation: only direct imports are checked. Run: make lint.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Only charging_sessions uses its own repository and models"
type = "forbidden"
source_modules = ["app.domains.charging_stations", "app.domains.drivers", "app.domains.fleet", "app.domains.notifications", "app.domains.support", "app.domains.telematics", "app.domains.telemetry", "app.domains.vehicles"]
forbidden_modules = ["app.domains.charging_sessions.repository", "app.domains.charging_sessions.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only charging_stations uses its own repository and models"
